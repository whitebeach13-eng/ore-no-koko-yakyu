<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12365a">
<meta name="description" content="自分だけの高校を作り、選手を育て、甲子園を目指す高校野球育成シミュレーション">
<link rel="manifest" href="manifest.json">
<title>俺の高校野球 — 育成重視版</title>
<style>
:root{--navy:#10283d;--blue:#245575;--sky:#e8f0f5;--green:#28634d;--gold:#b28a42;--ink:#172733;--paper:#eef2f4}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:12px 14px;font-weight:750;background:var(--blue);color:white;cursor:pointer;box-shadow:0 2px 0 #0c4777}button:active{transform:translateY(1px)}button.secondary{background:#e2edf7;color:var(--navy);box-shadow:none;border:1px solid #c4d8e9}button.green{background:var(--green);box-shadow:0 2px 0 #09582f}button.gold{background:#9a6810;box-shadow:0 2px 0 #754d08}.app{max-width:780px;margin:auto;min-height:100dvh;padding-bottom:82px}.hero{background:linear-gradient(140deg,#0b2235,#254e68);color:white;padding:20px 18px 16px;border-radius:0 0 24px 24px}.brand{font-size:25px;font-weight:950;letter-spacing:.03em}.tag{font-size:12px;opacity:.9;margin-top:2px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}.season{background:#ffffff20;border:1px solid #ffffff50;padding:7px 10px;border-radius:10px;font-size:12px}.heroStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.heroStats div{background:#ffffff16;border-radius:12px;padding:9px;text-align:center}.heroStats b{display:block;font-size:20px}.heroStats small{font-size:11px;opacity:.85}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d7e2ed;display:flex;justify-content:center;z-index:10;padding:7px 4px max(7px,env(safe-area-inset-bottom));gap:3px}.tabs button{background:transparent;color:#52677b;box-shadow:none;padding:7px 3px;flex:1;max-width:125px;font-size:11px;border-radius:10px}.tabs button.active{background:var(--sky);color:var(--blue)}.tabs span{display:block;font-size:20px;margin-bottom:1px}.page{padding:14px}.sectionTitle{font-size:19px;font-weight:900;margin:4px 0 10px}.sub{font-size:12px;color:#61758a}.card{background:white;border:1px solid #dce6ef;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 7px #173a5a08}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.grow{flex:1;min-width:0}.pill{display:inline-block;border-radius:999px;padding:4px 8px;background:#e8f2fb;color:#1a5e94;font-size:11px;font-weight:800}.pill.green{background:#e1f5e8;color:#176c3c}.pill.gold{background:#fff2d1;color:#805400}.progress{height:8px;border-radius:99px;background:#e5edf4;overflow:hidden;margin-top:5px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#2584c9,#5cc4a0);border-radius:99px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{padding:10px;background:#f5f9fc;border-radius:12px}.metric b{font-size:20px;display:block}.metric small{font-size:11px;color:#607489}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.btnrow button{flex:1;min-width:110px}.player{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid #edf1f5;padding:10px 0}.player:last-child{border:0}.playerName{font-weight:850}.playerMeta{font-size:11px;color:#62758a;margin-top:2px}.stars{color:#d49a20;letter-spacing:1px}.statline{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;margin-top:6px}.statline span{background:#eef3f7;padding:3px 6px;border-radius:6px}.field{display:block;font-size:12px;font-weight:800;margin:10px 0 5px}.field input,.field select{width:100%;border:1px solid #c8d8e6;border-radius:10px;padding:11px;background:white;color:var(--ink)}.notice{padding:11px;border-radius:12px;background:#fff7e2;color:#70521b;font-size:12px}.scoreboard{background:#0b2a44;color:#f6fbff;border-radius:16px;padding:14px;text-align:center}.score{font-size:31px;font-weight:950;letter-spacing:.08em}.inning{font-size:12px;color:#b8d6ee}.log{font-size:13px;line-height:1.8}.log p{margin:5px 0}.bracket{display:grid;grid-template-columns:1fr 1fr;gap:8px}.match{background:#f2f7fb;border-radius:10px;padding:9px;font-size:12px}.match b{display:block;margin-bottom:4px}.footer{text-align:center;color:#7890a3;font-size:10px;padding:10px}h3{margin:0 0 8px;font-size:15px} .empty{padding:24px;text-align:center;color:#6a8093}.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
<header class="hero">
 <div class="topline"><div><div class="brand">⚾ 俺の高校野球</div><div class="tag">選手を育て、采配で勝つ。</div></div><div class="season" id="season">1年目・春</div></div>
 <div class="heroStats"><div><b id="teamPower">D</b><small>チーム総合力</small></div><div><b id="teamMorale">72</b><small>チーム士気</small></div><div><b id="teamWins">0勝 0敗</b><small>今季成績</small></div></div>
</header>
<main class="page" id="main"></main>
<nav class="tabs">
<button data-tab="home" class="active"><span>🏠</span>ホーム</button>
<button data-tab="players"><span>👥</span>選手</button>
<button data-tab="practice"><span>🏋️</span>練習</button>
<button data-tab="match"><span>⚾</span>試合</button>
<button data-tab="school"><span>🏫</span>学校・記録</button>
</nav>
</div>
<script>
const $=id=>document.getElementById(id);
const positions=["投","捕","一","二","三","遊","左","中","右"];
const namesA=["山田","佐藤","鈴木","高橋","田中","伊藤","渡辺","中村","小林","加藤","吉田","山本","松本","井上","木村","林","清水","森","池田","橋本","阿部","石川","前田","藤田"];
const namesB=["太郎","翔","蓮","大翔","悠真","陽斗","陸","颯太","湊","樹","健太","拓海","直樹","大和","海斗","優","光","一真","悠","駿"];
const traits=["努力家","ムードメーカー","勝負強い","天才肌","守備職人","伸びしろ大","安定感"];
const defaults=()=>({school:"青空高校",uniform:"#1769aa",accent:"#ffffff",year:1,season:0,week:1,morale:72,credits:0,wins:0,losses:0,summerWins:0,fallWins:0,koshien:0,championships:0,log:["監督に就任しました。夢の甲子園を目指そう！"],players:Array.from({length:18},(_,i)=>newPlayer(i<3?3:i<9?2:1,i)),rosterSet:false,history:[],lastGame:null});
function newPlayer(grade,i){let p=positions[i%9],n=namesA[(i*7+3)%namesA.length]+namesB[(i*5+2)%namesB.length];let base=35+Math.floor(Math.random()*22);return {id:Date.now()+Math.random(),name:n,grade,pos:p,bat:base+Math.floor(Math.random()*20),power:base+Math.floor(Math.random()*20),run:base+Math.floor(Math.random()*20),field:base+Math.floor(Math.random()*20),arm:p==="投"?base+25:base+Math.floor(Math.random()*20),control:p==="投"?base+15:base+Math.floor(Math.random()*20),stamina:base+Math.floor(Math.random()*20),potential:Math.floor(Math.random()*3),trait:traits[Math.floor(Math.random()*traits.length)],condition:75+Math.floor(Math.random()*25),exp:0,injured:0}}
let state;
try{state=JSON.parse(localStorage.getItem("oreYakyuSave"))||defaults()}catch(e){state=defaults()}
let tab="home", selectedPlayer=null, strategy="バランス", lineupMode="標準", gameRunning=false;
function save(){localStorage.setItem("oreYakyuSave",JSON.stringify(state));updateHeader()}
function addLog(s){state.log.unshift("【"+state.year+"年目・"+["春","夏","秋","冬"][state.season]+"】"+s);state.log=state.log.slice(0,35)}
function rank(n){return n>=90?"S":n>=80?"A":n>=70?"B":n>=60?"C":n>=48?"D":"E"}
function teamPower(){let ps=state.players.filter(p=>p.grade>0);if(!ps.length)return 0;return Math.round(ps.reduce((a,p)=>a+(p.bat+p.power+p.run+p.field+(p.pos==="投"?p.arm+p.control+p.stamina: p.arm))/ (p.pos==="投"?7:5),0)/ps.length)}
function updateHeader(){ $("season").textContent=state.year+"年目・"+["春","夏","秋","冬"][state.season];$("teamPower").textContent=rank(teamPower());$("teamMorale").textContent=state.morale;$("teamWins").textContent=state.wins+"勝 "+state.losses+"敗"}
function playerCard(p){return `<div class="player"><div class="grow"><div class="playerName">${p.name} <span class="pill">${p.grade}年</span> <span class="pill">${p.pos}</span></div><div class="playerMeta">${p.trait} ・ 調子 ${p.condition}% ${p.injured?"・休養中":""}</div><div class="statline"><span>打 ${p.bat}</span><span>力 ${p.power}</span><span>走 ${p.run}</span><span>守 ${p.field}</span>${p.pos==="投"?`<span>球速 ${120+Math.round(p.arm*.35)}km/h</span><span>制 ${p.control}</span>`:""}</div></div><button class="secondary" onclick="openPlayer('${p.id}')">育成</button></div>`}
function render(){updateHeader();let main=$("main");if(tab==="home")main.innerHTML=homePage();if(tab==="players")main.innerHTML=playersPage();if(tab==="practice")main.innerHTML=practicePage();if(tab==="match")main.innerHTML=matchPage();if(tab==="school")main.innerHTML=schoolPage();document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab))}
function homePage(){let p=state.players.filter(p=>p.grade>0).sort((a,b)=>b.potential-a.potential)[0];return `<div class="card"><div class="row between"><div><span class="pill green">監督室</span><h2 style="margin:8px 0 2px">${esc(state.school)}</h2><div class="sub">${state.year}年目・${["春季","夏季","秋季","冬季"][state.season]}キャンプ / 第${state.week}週</div></div><div style="font-size:42px">⚾</div></div><div class="grid2" style="margin-top:14px"><div class="metric"><small>部員数</small><b>${state.players.filter(p=>p.grade>0).length}名</b></div><div class="metric"><small>監督ポイント</small><b>${state.credits}</b></div><div class="metric"><small>春の大会</small><b>${state.history.filter(x=>x.kind==="春").length}試合</b></div><div class="metric"><small>甲子園出場</small><b>${state.koshien}回</b></div></div></div>
<div class="card"><div class="row between"><h3>監督の次の一手</h3><span class="pill green">育成重視</span></div><p style="margin:6px 0">${p?`今週の注目選手：<strong>${p.name}</strong>（${p.grade}年・${p.pos}）。持ち味は「${p.trait}」。`: "まずは選手を育てましょう。"}</p><div class="sub">練習で能力を伸ばし、個別指導で才能を磨く。試合は短時間で結果を確認して、次の采配へ。</div><div class="btnrow" style="margin-top:12px"><button class="green" onclick="setTab('practice')">週間練習を決める</button><button class="secondary" onclick="setTab('players')">選手を個別育成</button></div></div>
<div class="card"><h3>📰 野球部ニュース</h3><div class="log">${state.log.slice(0,5).map(x=>`<p>• ${esc(x)}</p>`).join("")}</div></div>
<div class="btnrow"><button onclick="setTab('practice')">今週の練習を決める</button><button class="green" onclick="setTab('match')">大会・練習試合へ</button></div>
<div class="notice" style="margin-top:12px">育成重視版：練習・個別指導・采配・大会・世代交代。セーブはこの端末のブラウザ内に保存されます。ブラウザのデータ消去で消える場合があります。</div>`}
function playersPage(){let ps=state.players.filter(p=>p.grade>0).sort((a,b)=>b.grade-a.grade);return `<div class="sectionTitle">選手名鑑 <span class="pill">${ps.length}名</span></div><div class="card"><div class="sub">選手をタップして個別指導。能力値は0〜100、潜在力が高い選手は伸びやすい。</div>${ps.map(playerCard).join("")}</div><button class="secondary" style="width:100%" onclick="recruit()">＋ 新入生を3名スカウト（${state.credits}ポイント）</button>`}
function practicePage(){return `<div class="sectionTitle">週間練習メニュー</div><div class="card"><div class="sub">練習は1週間単位。選手の能力、疲労、士気が変動します。</div><label class="field">練習方針<select id="practiceType"><option value="打撃">打撃強化</option><option value="投手">投手強化</option><option value="守備">守備・走塁</option><option value="体力">体力づくり</option><option value="休養">休養・コンディション調整</option><option value="総合">総合練習</option></select></label><label class="field">練習強度<select id="intensity"><option value="軽め">軽め（ケガしにくい）</option><option value="通常" selected>通常</option><option value="ハード">ハード（成長大・疲労大）</option></select></label><div class="grid2"><div class="metric"><small>現在の士気</small><b>${state.morale}/100</b></div><div class="metric"><small>練習ポイント</small><b>${state.credits}</b></div></div><button class="green" style="width:100%;margin-top:12px" onclick="doPractice()">練習を実行して1週間進める</button></div><div class="card"><h3>成長のコツ</h3><p class="sub">・投手強化は投手の球威・制球・スタミナを重点育成。</p><p class="sub">・ハード練習は伸びやすい反面、ケガのリスクが上がります。</p><p class="sub">・大会前は休養を入れて調子を整えよう。</p></div>`}
function matchPage(){return `<div class="sectionTitle">大会・試合采配</div><p class="sub" style="margin:-4px 0 12px">試合は高速進行。勝敗を受け止め、次の練習と選手起用につなげよう。</p><div class="card"><div class="scoreboard"><div class="inning">${state.school}　対　ライバル校</div><div class="score">VS</div><div class="inning">作戦を決めて試合開始</div></div><label class="field">大会を選択<select id="tournament"><option value="練習試合">練習試合</option><option value="春季大会">春季地区大会</option><option value="夏の地方大会">夏の地方大会（甲子園予選）</option><option value="秋季大会">秋季大会</option><option value="甲子園">甲子園大会</option></select></label><label class="field">チーム作戦<select id="strategy"><option>バランス</option><option>強攻策</option><option>送りバント・機動力</option><option>守備重視</option><option>継投重視</option></select></label><label class="field">打順方針<select id="lineup"><option>標準</option><option>打撃力優先</option><option>機動力優先</option></select></label><div class="notice">試合はテンポよく結果を確認する簡易シミュレーション。勝敗は能力・調子・士気・作戦に影響されます。主役は試合演出よりも、育成と試合前の采配です。</div><button class="green" style="width:100%;margin-top:12px" onclick="startGame()">試合開始！</button></div><div id="gameResult">${state.lastGame?renderLastGame():""}</div><div class="card"><h3>🏆 今季の戦績</h3><div class="grid2"><div class="metric"><small>勝利</small><b>${state.wins}</b></div><div class="metric"><small>敗戦</small><b>${state.losses}</b></div><div class="metric"><small>甲子園出場</small><b>${state.koshien}</b></div><div class="metric"><small>優勝</small><b>${state.championships}</b></div></div></div>`}
function renderLastGame(){let g=state.lastGame;if(!g)return "";return `<div class="card"><div class="scoreboard"><div class="inning">${esc(g.tournament)}　${esc(g.opponent)}</div><div class="score">${g.ours} - ${g.theirs}</div><div class="inning">${g.win?"勝利！":"敗戦…"}</div></div><div class="log" style="margin-top:10px">${g.log.map(x=>`<p>• ${esc(x)}</p>`).join("")}</div>${g.win&&g.tournament==="夏の地方大会"?`<button class="gold" style="width:100%;margin-top:10px" onclick="goKoshien()">甲子園大会へ進む！</button>`:""}</div>`}
function schoolPage(){return `<div class="sectionTitle">学校・監督記録</div><div class="card"><h3>🏫 学校設定</h3><label class="field">学校名<input id="schoolName" maxlength="18" value="${esc(state.school)}"></label><div class="grid2"><label class="field">ユニフォーム色<input id="uniformColor" type="color" value="${state.uniform}"></label><label class="field">帽子・差し色<input id="accentColor" type="color" value="${state.accent}"></label></div><button style="width:100%" onclick="saveSchool()">設定を保存</button></div><div class="card"><h3>📚 年度成績・記録</h3><div class="grid2"><div class="metric"><small>通算勝利</small><b>${state.wins}</b></div><div class="metric"><small>通算敗戦</small><b>${state.losses}</b></div><div class="metric"><small>甲子園出場</small><b>${state.koshien}</b></div><div class="metric"><small>大会優勝</small><b>${state.championships}</b></div></div>${state.history.length?`<div class="log" style="margin-top:10px">${state.history.slice(-12).reverse().map(h=>`<p>• ${esc(h.year)}年目 ${esc(h.kind)}：${h.score}（${h.result}）</p>`).join("")}</div>`:"<p class='sub'>まだ公式戦の記録はありません。大会に挑戦しよう！"}</div><div class="card"><h3>🔄 世代交代</h3><p class="sub">年度を進めると3年生が卒業し、新入生が入部します。能力と記録を引き継いで、長期の監督生活を楽しめます。</p><button class="gold" style="width:100%" onclick="advanceYear()">年度を進める（3年生卒業・新入生入学）</button></div><div class="card"><h3>💾 セーブデータ</h3><div class="btnrow"><button class="secondary" onclick="exportSave()">データを書き出す</button><button class="secondary" onclick="$('importFile').click()">データを読み込む</button><button class="secondary" onclick="if(confirm('最初からやり直しますか？現在のセーブは失われます。')){state=defaults();save();render()}">最初から</button></div><input id="importFile" class="hidden" type="file" accept="application/json" onchange="importSave(event)"><p class="sub">端末変更やブラウザのデータ消去に備え、時々データを書き出してください。</p></div>`}
function openPlayer(id){let p=state.players.find(p=>String(p.id)===id);if(!p)return;selectedPlayer=p.id;let m=$("main");m.innerHTML=`<div class="sectionTitle">個別育成</div><div class="card"><div class="row"><div style="font-size:44px">🧢</div><div class="grow"><h2 style="margin:0">${esc(p.name)}</h2><div class="sub">${p.grade}年・${p.pos}・${p.trait}</div></div><span class="pill">${rank((p.bat+p.power+p.run+p.field)/4)}</span></div><div class="grid2" style="margin-top:12px">${[["打撃","bat"],["長打力","power"],["走力","run"],["守備","field"],["球威","arm"],["制球","control"],["スタミナ","stamina"]].map(([n,k])=>`<div class="metric"><small>${n} ${p[k]}</small><div class="progress"><i style="width:${p[k]}%"></i></div></div>`).join("")}</div><label class="field">個別指導<select id="individual"><option value="打撃">打撃フォーム指導</option><option value="パワー">筋力・長打強化</option><option value="走力">走塁・瞬発力</option><option value="守備">守備反復</option><option value="投球">投球・制球指導</option><option value="休養">ケア・休養</option></select></label><button class="green" style="width:100%" onclick="trainPlayer('${p.id}')">個別指導を実行（2ポイント）</button></div><button class="secondary" style="width:100%" onclick="setTab('players')">選手一覧へ戻る</button>`}
function doPractice(){let type=$("practiceType").value,int=$("intensity").value;let mult=int==="ハード"?1.65:int==="軽め"?.65:1;let injury=0, growth=0;state.players.filter(p=>p.grade>0).forEach(p=>{if(p.injured){p.injured--;return}let gain=Math.max(1,Math.round((1+p.potential*.5)*mult));if(type==="打撃"){p.bat=Math.min(100,p.bat+gain);p.power=Math.min(100,p.power+Math.max(0,gain-1))}else if(type==="投手"&&p.pos==="投"){p.arm=Math.min(100,p.arm+gain);p.control=Math.min(100,p.control+gain);p.stamina=Math.min(100,p.stamina+Math.max(1,gain-1))}else if(type==="守備"){p.field=Math.min(100,p.field+gain);p.run=Math.min(100,p.run+Math.max(1,gain-1))}else if(type==="体力"){p.stamina=Math.min(100,p.stamina+gain);p.run=Math.min(100,p.run+1)}else if(type==="総合"){["bat","run","field"].forEach(k=>p[k]=Math.min(100,p[k]+1));if(p.pos==="投")p.control=Math.min(100,p.control+1)}if(type==="休養"){p.condition=Math.min(100,p.condition+12);p.injured=Math.max(0,p.injured-1)}else{p.condition=Math.max(35,p.condition-(int==="ハード"?12:5));if(int==="ハード"&&Math.random()<.035){p.injured=2;injury++}}growth+=gain});state.morale=Math.min(100,Math.max(35,state.morale+(type==="休養"?8:2)));state.credits+=3;state.week++;addLog(`${type}練習（${int}）を実施。選手たちが成長し、練習ポイント+3。${injury?injury+"名がケガで休養。":""}`);save();render();alert(`練習終了！\n成長ポイント合計：約${growth}\n${injury?injury+"名がケガをしました。":"大きなケガはありませんでした。"}\n次の週に進みました。`)}
function trainPlayer(id){let p=state.players.find(p=>String(p.id)===id);if(state.credits<2){alert("ポイント不足です。練習をしてポイントを獲得してください。");return}let type=$("individual").value;state.credits-=2;if(type==="打撃"){p.bat+=3;p.power+=1}else if(type==="パワー")p.power+=4;else if(type==="走力")p.run+=4;else if(type==="守備")p.field+=4;else if(type==="投球"){p.arm+=2;p.control+=2;p.stamina+=1}else p.condition=Math.min(100,p.condition+20);["bat","power","run","field","arm","control","stamina"].forEach(k=>p[k]=Math.min(100,p[k]));addLog(`${p.name}に${type}の個別指導を実施。`);save();openPlayer(id)}
function recruit(){if(state.credits<3){alert("ポイントが足りません。練習を進めてください。");return}state.credits-=3;for(let i=0;i<3;i++){let p=newPlayer(1,Math.floor(Math.random()*9));p.name=namesA[Math.floor(Math.random()*namesA.length)]+namesB[Math.floor(Math.random()*namesB.length)];p.potential=Math.floor(Math.random()*3);state.players.push(p)}addLog("期待の新入生3名が入部しました！");save();render()}
function startGame(){let tournament=$("tournament").value;strategy=$("strategy").value;lineupMode=$("lineup").value;if(tournament==="甲子園"&&state.koshien===0){alert("まず夏の地方大会を勝ち抜いて甲子園出場を決めましょう！");return}let ps=state.players.filter(p=>p.grade>0&&!p.injured);if(ps.length<9){alert("試合に出られる選手が9名必要です。");return}let ability=teamPower()+(state.morale-50)*.18+ps.reduce((a,p)=>a+(p.condition-70)*.07,0)/ps.length;ability+=strategy==="強攻策"?2:strategy==="守備重視"?1:strategy==="送りバント・機動力"?ps.reduce((a,p)=>a+p.run,0)/ps.length*.025:0;ability+=lineupMode==="打撃力優先"?ps.reduce((a,p)=>a+p.bat+p.power,0)/ps.length*.018:lineupMode==="機動力優先"?ps.reduce((a,p)=>a+p.run,0)/ps.length*.03:0;let opponent=42+Math.random()*37;let ours=Math.max(0,Math.round(ability/12+Math.random()*5));let theirs=Math.max(0,Math.round(opponent/12+Math.random()*5));if(ours===theirs){if(Math.random()>.5)ours++;else theirs++}let win=ours>theirs;let logs=[`先発投手の調子は${ps.filter(p=>p.pos==="投").sort((a,b)=>b.condition-a.condition)[0]?.condition||70}%。作戦「${strategy}」で試合開始。`,`打線は${ours>=5?"つながりを見せて":"チャンスをうかがい"}、${ours}点を獲得。`,win?"投手陣がリードを守り切りました。":"相手打線に押し切られました。",win?"選手たちの士気が上がりました。":"敗戦を糧に次の練習へ。"];state.lastGame={tournament,opponent:"強豪・さくら高校",ours,theirs,win,log:logs};state.history.push({year:state.year,kind:tournament.includes("夏")?"夏":tournament.includes("秋")?"秋":tournament.includes("春")?"春":tournament,score:ours+"-"+theirs,result:win?"勝":"負"});if(win){state.wins++;state.morale=Math.min(100,state.morale+6);state.credits+=4;ps.forEach(p=>{p.exp+=2;if(Math.random()<.35)p.condition=Math.min(100,p.condition+5)});if(tournament==="甲子園"){state.koshien++;if(ours>=5){state.championships++;addLog("甲子園大会で優勝！歴史に残る快挙です！")}}if(tournament==="夏の地方大会"){state.summerWins++;if(state.summerWins>=3){state.koshien++;state.summerWins=0;addLog("夏の地方大会を突破！甲子園出場決定！")}}}else{state.losses++;state.morale=Math.max(30,state.morale-5)}addLog(`${tournament}で${ours}-${theirs}。${win?"勝利！":"敗戦。"}ポイント${win?"+4":"+1"}。`);if(!win)state.credits++;save();render();window.scrollTo(0,0)}
function goKoshien(){state.koshien++;state.lastGame=null;save();setTab("match");setTimeout(()=>{let s=$("tournament");if(s)s.value="甲子園";},20)}
function advanceYear(){if(!confirm("年度を進めます。3年生は卒業し、1年生が新たに入部します。進めますか？"))return;let grads=state.players.filter(p=>p.grade===3);state.players=state.players.filter(p=>p.grade!==3);state.players.forEach(p=>p.grade=Math.max(1,p.grade+1));let count=Math.max(9,grads.length+3);for(let i=0;i<count;i++)state.players.push(newPlayer(1,Math.floor(Math.random()*9)));state.year++;state.season=0;state.week=1;state.summerWins=0;state.morale=70;state.players.forEach(p=>{p.condition=85+Math.floor(Math.random()*15);p.injured=0});addLog(`年度更新。3年生${grads.length}名が卒業し、新入生${count}名が入部。新チーム始動！`);save();render();alert(`新年度スタート！\n卒業：${grads.length}名\n入部：${count}名`)}
function saveSchool(){state.school=$("schoolName").value.trim()||"新設高校";state.uniform=$("uniformColor").value;state.accent=$("accentColor").value;addLog(`学校設定を更新。新しい校名は「${state.school}」。`);save();render();alert("学校設定を保存しました！")}
function exportSave(){let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ore-no-koko-yakyu-save.json";a.click();URL.revokeObjectURL(a.href)}
function importSave(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(!v.players||!v.school)throw Error();state=v;save();render();alert("セーブデータを読み込みました")}catch(err){alert("データを読み込めませんでした")}};r.readAsText(f)}
function setTab(t){tab=t;render();window.scrollTo(0,0)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
if("serviceWorker" in navigator && location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
render();
</script>
</body>
</html>

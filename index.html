<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#071e43"><title>俺の高校野球</title><style>
*{box-sizing:border-box}body{margin:0;background:#07152c;color:#fff;font-family:system-ui,sans-serif}header{padding:12px;background:linear-gradient(100deg,#071e43,#1266a7);border-bottom:3px solid #ffd66b}h1{font-size:20px;margin:0}.wrap{max-width:850px;margin:auto;padding:9px}.panel,.card{border-radius:13px;overflow:hidden;background:#f3f7fc;color:#102744;margin-bottom:10px}.score{display:flex;justify-content:space-between;gap:8px;background:#102f55;color:white;padding:10px}.score strong{font-size:20px}.mini{font-size:12px}canvas{width:100%;height:auto;display:block;touch-action:manipulation}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:9px}button{border:0;border-radius:9px;padding:12px 5px;font-weight:800;background:#0c5798;color:white;box-shadow:0 3px #07335c;font-size:14px}button.gold{background:#e7a91d;color:#14253b;box-shadow:0 3px #9c6a08}.message{margin:0 9px 9px;background:#e5f0fc;border-radius:8px;padding:10px;min-height:45px;font-weight:700}.lower{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{padding:12px}.card h3{margin:0 0 8px;color:#0b4f91}.roster{display:flex;gap:7px}.player{flex:1;text-align:center;background:#eaf2fc;padding:7px;border-radius:9px;color:#102744}.face{font-size:32px;background:linear-gradient(#f7d5ae 0 65%,#133e6c 65%);border-radius:50%;width:53px;height:53px;margin:auto auto 5px}.player b{font-size:12px}.player small{display:block;font-size:10px}@media(max-width:600px){.lower{grid-template-columns:1fr}.score strong{font-size:16px}button{font-size:12px}}
</style></head><body><header><h1>⚾ 俺の高校野球 ～目指せ、甲子園～</h1><small>v0.4 試作｜タイミング打撃・動く守備</small></header><main class="wrap"><section class="panel"><div class="score"><div><div class="mini" id="inning">夏の地方大会 1回表</div><strong>青葉高校 <span id="a">0</span> - <span id="b">0</span> 東雲高校</strong></div><div class="mini" id="count">B 0 S 0 O 0<br>走者なし</div></div><canvas id="cv" width="800" height="480"></canvas><div class="controls"><button class="gold" id="swing">🏏 スイング！</button><button id="take">👀 見送る</button><button id="pitch">⚾ 次の投球</button><button id="left">⬅ 守備 左</button><button id="right">守備 右 ➡</button><button id="throw">🎯 捕球・送球</button></div><div class="message" id="msg">「プレイボール」を押して試合開始！</div><div class="controls"><button class="gold" id="start">▶ プレイボール</button><button id="reset">試合をやり直す</button><button id="next">次のイニング演出</button></div></section><div class="lower"><section class="card"><h3>👥 青葉高校 選手</h3><div class="roster"><div class="player"><div class="face">😠</div><b>佐藤 蓮</b><small>投手・3年</small></div><div class="player"><div class="face">😎</div><b>田中 大樹</b><small>捕手・3年</small></div><div class="player"><div class="face">😁</div><b>山田 悠</b><small>遊撃・2年</small></div></div></section><section class="card"><h3>📋 試合メモ</h3><div id="stats">安打 0　四球 0<br>三振 0　失策 0</div><p>打撃は球がホームに近づいた時にスイング。打球が飛んだら左右で守備選手を動かし、捕球・送球を押そう。</p></section></div></main><script>
const c=document.getElementById('cv'),x=c.getContext('2d'),$=id=>document.getElementById(id);
let s;
function reset(){s={live:false,phase:'idle',inning:1,half:0,b:0,st:0,o:0,score:[0,0],bases:[0,0,0],pt:0,pdur:1,px:150,py:180,bx:420,by:370,vx:0,vy:0,fx:550,fy:260,hits:0,walks:0,ks:0,errors:0,turn:0};$('msg').textContent='プレイボールを押して試合開始！';ui();draw()}
function ui(){$('inning').textContent=`${s.inning}回${s.half?'裏':'表'}　${s.half?'東雲':'青葉'}高校の攻撃`;$('a').textContent=s.score[0];$('b').textContent=s.score[1];$('count').innerHTML=`B ${s.b}　S ${s.st}　O ${s.o}<br>${s.bases.map((v,i)=>v?['一塁','二塁','三塁'][i]:'').filter(Boolean).join('・')||'走者なし'}`;$('stats').innerHTML=`打数 ${s.turn}　安打 ${s.hits}<br>四球 ${s.walks}　三振 ${s.ks}　失策 ${s.errors}`}
function person(px,py,jersey,cap,run=false){x.save();x.translate(px,py);x.fillStyle='#0a3327aa';x.beginPath();x.ellipse(0,13,17,5,0,0,7);x.fill();x.strokeStyle='#18334b';x.lineWidth=7;x.lineCap='round';x.beginPath();x.moveTo(-4,0);x.lineTo(run?-14:-6,14);x.moveTo(4,0);x.lineTo(run?14:6,14);x.stroke();x.fillStyle=jersey;x.fillRect(-11,-18,22,22);x.strokeStyle=jersey;x.lineWidth=6;x.beginPath();x.moveTo(-8,-13);x.lineTo(-15,-3);x.moveTo(8,-13);x.lineTo(15,-3);x.stroke();x.fillStyle='#f0bd91';x.beginPath();x.arc(0,-26,9,0,7);x.fill();x.fillStyle=cap;x.beginPath();x.arc(0,-28,10,Math.PI,0);x.lineTo(11,-25);x.lineTo(-10,-25);x.fill();x.fillStyle='#17283a';x.fillRect(-4,-26,2,2);x.fillRect(3,-26,2,2);x.restore()}
function draw(){x.clearRect(0,0,800,480);let gr=x.createLinearGradient(0,0,0,480);gr.addColorStop(0,'#83c5ef');gr.addColorStop(.35,'#c8e7f1');gr.addColorStop(.36,'#33894d');gr.addColorStop(1,'#145b37');x.fillStyle=gr;x.fillRect(0,0,800,480);x.fillStyle='#657b91';x.fillRect(0,75,800,48);for(let i=0;i<90;i++){x.fillStyle=['#eee','#e6c348','#cc5151','#3b78b9'][i%4];x.beginPath();x.arc((i*39)%800,82+(i%3)*12,4,0,7);x.fill()}x.fillStyle='#123b60';x.fillRect(0,122,800,10);x.fillStyle='#fff';x.font='bold 18px sans-serif';x.fillText('夏季高校野球大会',20,30);x.fillStyle='#b98450';x.beginPath();x.moveTo(400,150);x.lineTo(650,300);x.lineTo(400,450);x.lineTo(150,300);x.closePath();x.fill();x.strokeStyle='#fff5d9';x.lineWidth=3;x.stroke();x.fillStyle='#34874b';x.beginPath();x.moveTo(400,195);x.lineTo(575,300);x.lineTo(400,405);x.lineTo(225,300);x.closePath();x.fill();[[400,450],[650,300],[400,150],[150,300]].forEach(([a,b])=>{x.save();x.translate(a,b);x.rotate(.78);x.fillStyle='white';x.fillRect(-7,-7,14,14);x.restore()});x.fillStyle='#c99b68';x.beginPath();x.ellipse(400,300,32,18,0,0,7);x.fill();[[400,210],[325,235],[475,235],[300,290],[500,290],[400,330],[245,265],[555,265],[400,400]].forEach((p,i)=>person(s.phase==='field'&&i===4?s.fx:p[0],s.phase==='field'&&i===4?s.fy:p[1],'#f3f4ed','#8b2535'));person(430,420,'#f3f4ed','#123b66',s.phase==='hit');person(400,278,'#f3f4ed','#8b2535');person(400,453,'#f3f4ed','#123b66');x.strokeStyle='#75451f';x.lineWidth=7;x.beginPath();x.moveTo(423,397);x.lineTo(455,370);x.stroke();if(['pitch','swing'].includes(s.phase)||['hit','field'].includes(s.phase)){x.fillStyle='white';x.beginPath();x.arc(['pitch','swing'].includes(s.phase)?s.px:s.bx,['pitch','swing'].includes(s.phase)?s.py:s.by,7,0,7);x.fill();x.strokeStyle='#d44';x.lineWidth=1;x.stroke()}x.fillStyle='#071e43dd';x.fillRect(14,430,300,36);x.fillStyle='white';x.font='bold 16px sans-serif';x.fillText(({idle:'試合開始を待っています',pitch:'投球中！タイミングを見ろ！',ready:'次の投球を待とう',swing:'スイング！',hit:'打球が飛んだ！',field:'打球を追え！'}[s.phase]||'プレイ中'),26,454)}
function newPitch(){if(!s.live)return;s.phase='pitch';s.pt=0;s.pdur=.85+Math.random()*.55;s.px=150;s.py=170;$('msg').textContent='投球が来る！ホーム付近でスイング！';ui()}
function atbat(type){s.phase='ready';if(type==='ball'){s.b++;if(s.b>=4){s.walks++;s.b=s.st=0;runner();$('msg').textContent='フォアボール！走者が出た！'}else $('msg').textContent='ボール！見極め成功！'}if(type==='strike'){s.st++;if(s.st>=3){s.o++;s.ks++;s.b=s.st=0;$('msg').textContent='三振！アウト！';halfCheck()}else $('msg').textContent='ストライク！次の球に集中！'}if(type==='foul'){if(s.st<2)s.st++;$('msg').textContent='ファウル！打ち直し！'}ui();draw()}
function runner(){if(s.bases[2])s.score[s.half]++;s.bases[2]=s.bases[1];s.bases[1]=s.bases[0];s.bases[0]=1}
function halfCheck(){if(s.o>=3){s.o=0;s.b=s.st=0;s.bases=[0,0,0];if(!s.half)s.half=1;else{s.half=0;s.inning++}if(s.inning>3){s.live=false;$('msg').textContent=`試合終了！ ${s.score[0]} - ${s.score[1]}。試作版の試合を最後までプレイ！`}else $('msg').textContent=`攻守交代！ ${s.inning}回${s.half?'裏':'表'}へ。`}}
function swing(){if(!s.live||s.phase!=='pitch')return;s.phase='swing';s.turn++;let q=Math.abs(s.pt/s.pdur-.8);setTimeout(()=>{if(s.phase!=='swing')return;if(q<.2){s.hits++;s.phase='hit';s.bx=430;s.by=385;s.vx=(Math.random()-.5)*390;s.vy=-270;$('msg').textContent=q<.08?'ジャストミート！鋭い打球！':'バットに当たった！守備に切り替え！';hitAnim()}else atbat(q<.3?'foul':'strike')},100)}
function hitAnim(){if(s.phase!=='hit')return;s.bx+=s.vx*.035;s.by+=s.vy*.035;s.vy+=9;if(s.by<145){s.phase='field';s.fx=s.bx>400?550:250;s.fy=260;$('msg').textContent='打球が外野へ！左右ボタンで選手を動かし、捕球しよう！'}draw();if(s.phase==='hit')requestAnimationFrame(hitAnim);else ui()}
function fieldMove(d){if(s.phase!=='field')return;s.fx=Math.max(65,Math.min(735,s.fx+d));draw()}
function fieldCatch(){if(s.phase!=='field')return;let d=Math.hypot(s.fx-s.bx,s.fy-s.by);if(d<120){$('msg').textContent='捕球成功！打者走者は一塁へ！';runner()}else{$('msg').textContent='捕球できず！失策になった！';s.errors++;s.bases[0]=1} s.phase='ready';s.b=s.st=0;ui();draw()}
$('start').onclick=()=>{reset();s.live=true;newPitch();$('msg').textContent='プレイボール！投球が来るぞ！'};$('reset').onclick=reset;$('swing').onclick=swing;$('take').onclick=()=>{if(s.phase==='pitch')atbat(Math.random()<.38?'ball':'strike')};$('pitch').onclick=()=>{if(s.phase==='ready')newPitch()};$('left').onclick=()=>fieldMove(-38);$('right').onclick=()=>fieldMove(38);$('throw').onclick=fieldCatch;$('next').onclick=()=>{if(s.live&&s.phase==='ready')newPitch()};c.addEventListener('pointerdown',e=>{if(s.phase==='field'){let r=c.getBoundingClientRect();s.fx=(e.clientX-r.left)*800/r.width;s.fy=(e.clientY-r.top)*480/r.height;draw()}});
let last=0;function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;if(s.phase==='pitch'){s.pt+=dt;let p=Math.min(1,s.pt/s.pdur);s.px=150+250*p;s.py=170+230*p;if(p>=1){s.phase='ready';$('msg').textContent='捕手のミットに到達。次の投球へ！';atbat(Math.random()<.45?'ball':'strike')}}draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></body></html>

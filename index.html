<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#123b2b">
<title>俺の高校野球 v0.3</title>
<style>
:root{--bg:#f4f2e9;--green:#123b2b;--green2:#1e6546;--gold:#f1c75b;--ink:#18231e;--muted:#69766e;--card:#fffef9;--line:#dce2d8;--red:#b93a32}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
header{background:linear-gradient(135deg,#0e3023,#1c6245);color:white;padding:18px 16px 15px;position:sticky;top:0;z-index:4;box-shadow:0 3px 12px #102b2028}
.brand{font-size:12px;letter-spacing:.12em;color:#d7e8d8}.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.headrow h1{font-size:21px;margin:3px 0 0}.yearpill{font-size:12px;background:#ffffff20;border:1px solid #ffffff50;border-radius:99px;padding:6px 9px;white-space:nowrap}
nav{display:flex;gap:6px;padding:10px;overflow:auto;background:#e8e9df;position:sticky;top:82px;z-index:3}
nav button{flex:1;min-width:max-content;border:0;border-radius:10px;padding:10px 12px;background:#d8ded3;color:#304238;font-weight:700}
nav button.active{background:var(--green);color:white}
main{max-width:760px;margin:0 auto;padding:12px 12px 92px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:0 0 12px;box-shadow:0 2px 8px #20352808}
h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:0 0 8px}.muted{color:var(--muted);font-size:13px}.big{font-size:23px;font-weight:850;letter-spacing:.02em}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{background:#f0f4ed;border-radius:12px;padding:11px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:19px}
button{font:inherit;cursor:pointer}.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--green);color:white;font-weight:750;width:100%;margin-top:7px}.btn.secondary{background:#e5ebe2;color:#234334}.btn.gold{background:var(--gold);color:#3c3011}.btn.red{background:#f6e3df;color:#8f2924}.btn:disabled{opacity:.4;cursor:not-allowed}
.choice{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;margin:7px 0;background:#fff}.choice input{margin-top:5px;accent-color:var(--green)}.choice b{display:block}.choice span{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:750;border-radius:6px;padding:4px 7px;background:#e3eee4;color:#23563a}.tag.red{background:#f7e4df;color:#9b3029}.tag.gold{background:#f8efcf;color:#745815}
.player{display:grid;grid-template-columns:1fr auto;gap:5px;padding:10px 0;border-bottom:1px solid var(--line)}.player:last-child{border-bottom:0}.skills{font-size:12px;color:var(--muted)}
.log{background:#14291f;color:#e9f2e7;border-radius:12px;padding:12px;min-height:115px;max-height:220px;overflow:auto;font-size:13px;line-height:1.7}.log p{margin:0 0 5px}.scoreboard{width:100%;border-collapse:collapse;font-size:12px;text-align:center}.scoreboard th,.scoreboard td{padding:7px 3px;border-bottom:1px solid var(--line)}.scoreboard th{color:var(--muted);font-weight:650}.scoreboard .ours{background:#e5f1e6;font-weight:850}
.diamond{width:112px;height:112px;position:relative;margin:8px auto 14px;transform:rotate(45deg);border:2px solid #b6c9a9;background:#e6eddf;border-radius:5px}
.base{width:15px;height:15px;background:white;border:2px solid #a5b89a;position:absolute;transform:rotate(-45deg);border-radius:2px}
.base.on{background:var(--gold);border-color:#ad8522}.b2{top:-8px;left:calc(50% - 7px)}.b1{right:-8px;top:calc(50% - 7px)}.b3{bottom:-8px;left:calc(50% - 7px)}.b0{left:-8px;top:calc(50% - 7px)}
.bottomhint{position:fixed;bottom:0;left:0;right:0;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#fffef9ee;border-top:1px solid var(--line);font-size:11px;color:var(--muted);text-align:center;z-index:5}
.story{border-left:3px solid var(--gold);padding:4px 0 4px 12px;line-height:1.7}.school{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.school:last-child{border-bottom:0}
@media(min-width:600px){main{padding-top:18px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}nav{justify-content:center}nav button{flex:0 1 auto}}
</style>
</head>
<body>
<header><div class="brand">HIGH SCHOOL BASEBALL SIMULATION</div><div class="headrow"><h1>俺の高校野球 <span style="font-size:12px;color:#d4e7d7">v0.3</span></h1><span class="yearpill" id="yearpill">1年目・春</span></div></header>
<nav id="nav">
<button data-tab="home" class="active">部室</button><button data-tab="team">選手・育成</button><button data-tab="schedule">大会・日程</button><button data-tab="match">試合</button><button data-tab="story">記録・物語</button>
</nav>
<main id="app"></main>
<div class="bottomhint">自動保存対応 ・ 1試合で優勝にはなりません（笑） ・ 試合は采配で進行</div>
<script>
const $=s=>document.querySelector(s);
const pos=['投','捕','一','二','三','遊','左','中','右'];
const first=['大翔','悠真','蓮','陽翔','湊','蒼','樹','朝陽','颯太','陸','結翔','大和','晴','翼','拓海','優','航','直人','健太','海斗','悠','翔','龍之介','駿','匠'];
const last=['佐藤','田中','鈴木','高橋','伊藤','渡辺','山本','中村','小林','加藤','吉田','山田','松本','井上','木村','林','清水','森','池田','橋本','阿部','石川','前田','藤田','岡田'];
const schoolNames=['青嵐高校','北稜学園','海風高校','桜ヶ丘高校','東央工業','白峰高校','西ヶ丘高校','龍神高校','星陵高校','緑川高校','南陽高校','大河高校'];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function player(i,year=1){let p=pos[i%9];let base=36+Math.floor(Math.random()*25);return {id:Math.random().toString(36).slice(2,9),name:pick(last)+pick(first),year, pos:p, bat:clamp(base+(p==='投'?-4:0)+Math.floor(Math.random()*10),25,85),power:clamp(base+Math.floor(Math.random()*18)-7,20,85),field:clamp(base+Math.floor(Math.random()*18)-4,20,85),speed:clamp(base+Math.floor(Math.random()*20)-3,20,90),pitch: p==='投'?clamp(base+Math.floor(Math.random()*24),25,92):clamp(20+Math.floor(Math.random()*20),15,50),stamina:60+Math.floor(Math.random()*35),condition:75+Math.floor(Math.random()*26),potential:Math.floor(Math.random()*3)+1,injury:0}}
function makeTeam(){return Array.from({length:18},(_,i)=>player(i, i<6?3:i<12?2:1))}
function fresh(){let schools=schoolNames.map((name,i)=>({name,power:45+Math.floor(Math.random()*34),id:i}));return {version:3,school:'県立みどり野高校',year:1,month:'春',week:1,rep:12,morale:65,facilities:1,budget:100,team:makeTeam(),schools,story:['春。赴任したばかりの監督に託されたのは、部員18人の県立みどり野高校。目標は、まだ遠い甲子園。'],records:[],tournament:null,lastResult:null,practiceCount:0,wonKoshien:0,seasonWins:0,seasonLosses:0,champion:false,day:1}}
let S;try{S=JSON.parse(localStorage.getItem('oreKokoV3'));if(!S||S.version!==3)S=fresh()}catch(e){S=fresh()}
function save(){localStorage.setItem('oreKokoV3',JSON.stringify(S));$('#yearpill').textContent=`${S.year}年目・${S.month}`;}
function story(t){S.story.unshift(t);S.story=S.story.slice(0,60)}
function best(p,k){return [...p].sort((a,b)=>b[k]-a[k])[0]}
function lineup(){let sorted=[...S.team].filter(p=>p.injury<=0).sort((a,b)=>(b.bat+b.field+b.condition/4)-(a.bat+a.field+a.condition/4));let out=[];let used=new Set();for(let po of pos){let p=sorted.find(x=>x.pos===po&&!used.has(x.id))||sorted.find(x=>!used.has(x.id));if(p){out.push(p);used.add(p.id)}}return out}
function overall(){let a=S.team;return Math.round(a.reduce((n,p)=>n+(p.bat+p.power+p.field+(p.pos==='投'?p.pitch:0))/ (p.pos==='投'?4:3),0)/a.length)}
function home(){let bestp=best(S.team,'bat'), ace=best(S.team,'pitch');return `<section class="panel"><div class="row between"><div><span class="tag">監督モード</span><h2 style="margin-top:8px">${S.school}</h2><div class="muted">${S.year}年目 / ${S.month} / 評判 ${S.rep}</div></div><div style="text-align:right"><div class="big">${overall()}</div><div class="muted">チーム力</div></div></div><div class="grid" style="margin-top:13px"><div class="stat"><small>部員</small><strong>${S.team.length}人</strong></div><div class="stat"><small>士気</small><strong>${S.morale}</strong></div><div class="stat"><small>練習設備</small><strong>Lv.${S.facilities}</strong></div><div class="stat"><small>部費</small><strong>${S.budget}</strong></div></div></section>
<section class="panel"><h2>監督室</h2><div class="story">${S.story[0]||'新しいシーズンが始まる。'}</div><button class="btn" onclick="train()">今日の練習を行う</button><button class="btn secondary" onclick="advance()">次の日へ進む</button></section>
<section class="panel"><h2>チームの注目選手</h2><div class="player"><div><b>${bestp.name}</b> <span class="tag">主軸打者</span><div class="skills">打撃 ${bestp.bat} / 長打 ${bestp.power} / 守備 ${bestp.field}</div></div><b>${bestp.year}年</b></div><div class="player"><div><b>${ace.name}</b> <span class="tag gold">投手陣</span><div class="skills">球威 ${ace.pitch} / 体力 ${ace.stamina} / 調子 ${ace.condition}</div></div><b>${ace.year}年</b></div></section>
<section class="panel"><h2>今季の戦績</h2><div class="grid"><div class="stat"><small>勝利</small><strong>${S.seasonWins}</strong></div><div class="stat"><small>敗戦</small><strong>${S.seasonLosses}</strong></div><div class="stat"><small>甲子園優勝</small><strong>${S.wonKoshien}回</strong></div><div class="stat"><small>練習回数</small><strong>${S.practiceCount}</strong></div></div></section>`}
function team(){return `<section class="panel"><h2>選手名鑑</h2><p class="muted">練習で能力が伸び、試合や日々のコンディションで力を発揮します。卒業すると世代交代します。</p><div class="grid"><div class="stat"><small>打撃平均</small><strong>${Math.round(S.team.reduce((a,p)=>a+p.bat,0)/S.team.length)}</strong></div><div class="stat"><small>守備平均</small><strong>${Math.round(S.team.reduce((a,p)=>a+p.field,0)/S.team.length)}</strong></div><div class="stat"><small>投手力</small><strong>${Math.round(S.team.reduce((a,p)=>a+p.pitch,0)/S.team.length)}</strong></div><div class="stat"><small>故障者</small><strong>${S.team.filter(p=>p.injury>0).length}</strong></div></div></section>
<section class="panel"><h2>練習方針</h2><label class="choice"><input type="radio" name="tr" value="bat" checked><div><b>打撃練習</b><span>打撃・長打を伸ばす。守備は少し落ちることも。</span></div></label><label class="choice"><input type="radio" name="tr" value="pitch"><div><b>投手・走り込み</b><span>投手力と体力を強化。疲労がたまりやすい。</span></div></label><label class="choice"><input type="radio" name="tr" value="field"><div><b>守備・連携</b><span>守備力を強化し、士気も上がりやすい。</span></div></label><label class="choice"><input type="radio" name="tr" value="rest"><div><b>休養日</b><span>調子と体力を回復し、故障リスクを下げる。</span></div></label><button class="btn" onclick="train()">この方針で練習する</button></section>
<section class="panel"><h2>全選手</h2>${S.team.slice().sort((a,b)=>b.year-a.year).map(p=>`<div class="player"><div><b>${p.name}</b> <span class="tag">${p.year}年・${p.pos}</span>${p.injury>0?'<span class="tag red">故障 '+p.injury+'日</span>':''}<div class="skills">打 ${p.bat} / 長 ${p.power} / 守 ${p.field} / 走 ${p.speed} / 投 ${p.pitch} / 調子 ${p.condition}</div></div><b>${Math.round((p.bat+p.power+p.field+p.pitch)/4)}</b></div>`).join('')}</section>`}
function schedule(){return `<section class="panel"><h2>年間スケジュール</h2><div class="school"><div><b>春季県大会</b><div class="muted">春・新チームの実力試し</div></div><span class="tag">公式戦</span></div><div class="school"><div><b>練習試合・強化期間</b><div class="muted">夏までにチームを鍛える</div></div><span class="tag gold">育成</span></div><div class="school"><div><b>夏の県大会</b><div class="muted">優勝校だけが甲子園へ</div></div><span class="tag red">重要</span></div><div class="school"><div><b>全国高校野球選手権</b><div class="muted">県代表になった場合のみ出場</div></div><span class="tag red">甲子園</span></div><button class="btn" onclick="startTournament('春季県大会')">春季県大会にエントリー</button><button class="btn gold" onclick="startTournament('夏の県大会')">夏の県大会にエントリー</button></section>
<section class="panel"><h2>ライバル高校</h2>${S.schools.map(s=>`<div class="school"><div><b>${s.name}</b><div class="muted">チーム力 ${s.power} ・ ${s.power>overall()+8?'強豪校':s.power<overall()-8?'格下校':'互角'}</div></div><span class="tag">${s.power>75?'優勝候補':s.power>60?'上位校':'挑戦校'}</span></div>`).join('')}</section>
<section class="panel"><h2>設備投資</h2><p class="muted">部費を使って設備を強化すると、日々の成長が少し良くなります。</p><button class="btn secondary" onclick="upgrade()">練習設備を強化（部費60）</button></section>`}
function match(){if(!S.tournament)return `<section class="panel"><h2>試合グラウンド</h2><p>まだ大会に参加していません。大会・日程からエントリーすると、対戦校が決まり試合が始まります。</p><button class="btn" onclick="tab('schedule')">大会・日程へ</button></section>`;
let t=S.tournament;return `<section class="panel"><div class="row between"><div><span class="tag">${t.name}</span><h2 style="margin-top:7px">${t.roundName}</h2><div class="muted">第${t.round}戦 / ${t.totalRounds}戦勝ち抜き</div></div><span class="tag gold">${t.phase==='playing'?'試合中':t.phase==='done'?'終了':'対戦待ち'}</span></div><div class="school"><div><b>${S.school}</b><div class="muted">チーム力 ${overall()}</div></div><b>${t.homeScore??'—'}</b></div><div class="school"><div><b>${t.opponent}</b><div class="muted">チーム力 ${t.opponentPower}</div></div><b>${t.awayScore??'—'}</b></div>
${t.phase==='playing'?`<div class="log" id="gamelog">${(t.log||[]).map(x=>`<p>${x}</p>`).join('')}</div><div class="diamond"><div class="base b2 ${t.bases[2]?'on':''}"></div><div class="base b1 ${t.bases[1]?'on':''}"></div><div class="base b3 ${t.bases[3]?'on':''}"></div><div class="base b0 ${t.bases[0]?'on':''}"></div></div><div class="muted" style="text-align:center">イニング ${t.inning}回 / ${t.half==='top'?'表':'裏'} ・ アウト ${t.outs}</div><button class="btn" onclick="playBall('normal')">▶ 次のプレー</button><div class="grid"><button class="btn secondary" onclick="playBall('bunt')">送りバント</button><button class="btn secondary" onclick="playBall('steal')">盗塁を狙う</button><button class="btn secondary" onclick="playBall('swing')">強振・長打狙い</button><button class="btn secondary" onclick="playBall('relief')">投手交代</button></div>`:t.phase==='ready'?`<p class="story">対戦相手は <b>${t.opponent}</b>。ここから試合が始まります。采配を選びながら1プレーずつ進めましょう。</p><button class="btn" onclick="beginMatch()">試合開始</button>`:t.phase==='done'?`<div class="story">${t.summary}</div><button class="btn" onclick="continueTournament()">次の試合へ</button>`:`<p>${t.summary||'大会は終了しました。'}</p><button class="btn" onclick="finishTournament()">大会を閉じる</button>`}</section>`}
function records(){return `<section class="panel"><h2>監督の記録</h2><div class="grid"><div class="stat"><small>監督年数</small><strong>${S.year}年</strong></div><div class="stat"><small>甲子園優勝</small><strong>${S.wonKoshien}</strong></div><div class="stat"><small>公式戦勝利</small><strong>${S.records.filter(r=>r.includes('勝利')).length}</strong></div><div class="stat"><small>チーム評判</small><strong>${S.rep}</strong></div></div></section><section class="panel"><h2>チームの物語</h2>${S.story.map(x=>`<div class="story" style="margin:0 0 12px">${x}</div>`).join('')}</section><section class="panel"><h2>セーブデータ</h2><button class="btn secondary" onclick="save();alert('保存しました')">手動セーブ</button><button class="btn red" onclick="if(confirm('最初からやり直しますか？これまでのセーブは消えます。')){S=fresh();save();render()}">最初からやり直す</button></section>`}
function render(){save();let t=document.querySelector('nav button.active')?.dataset.tab||'home';let f={home,team,schedule,match,story:records};$('#app').innerHTML=f[t]();if(t==='match'){let l=$('#gamelog');if(l)l.scrollTop=l.scrollHeight}}
function tab(t){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>tab(b.dataset.tab)));
function train(){let mode=document.querySelector('input[name="tr"]:checked')?.value||'bat';if(mode==='bat'){S.team.forEach(p=>{p.bat=clamp(p.bat+(Math.random()<.7?1:0),10,99);p.power=clamp(p.power+(Math.random()<.48?1:0),10,99);p.condition=clamp(p.condition-3,15,100)});story('打撃練習を実施。振り込みの成果が少しずつ出始めた。')}
if(mode==='pitch'){S.team.forEach(p=>{p.pitch=clamp(p.pitch+(p.pos==='投'?1:Math.random()<.2?1:0),10,99);p.stamina=clamp(p.stamina+1,10,100);p.condition=clamp(p.condition-7,10,100)});story('投手・走り込みを実施。投手陣の力が伸びたが、疲労も見える。')}
if(mode==='field'){S.team.forEach(p=>{p.field=clamp(p.field+(Math.random()<.75?1:0),10,99);p.condition=clamp(p.condition-2,15,100)});S.morale=clamp(S.morale+3,0,100);story('守備・連携練習を実施。声が出るようになり、チームの士気が上がった。')}
if(mode==='rest'){S.team.forEach(p=>{p.condition=clamp(p.condition+12,0,100);p.stamina=clamp(p.stamina+10,0,100);p.injury=Math.max(0,p.injury-1)});S.morale=clamp(S.morale+2,0,100);story('休養日。選手たちは体を休め、故障者も回復に向かった。')}
S.practiceCount++;S.day++;if(S.day%7===0)advanceMonth();save();tab('team')}
function advanceMonth(){let old=S.month;S.month=old==='春'?'初夏':old==='初夏'?'夏':old==='夏'?'秋':old==='秋'?'冬':'春';if(S.month==='春'&&old==='冬')graduate();S.team.forEach(p=>{p.condition=clamp(p.condition+6,0,100);p.injury=Math.max(0,p.injury-1)});story(`${S.month}になった。チームの状態を確認し、次の目標に備えよう。`)}
function advance(){S.day++;S.team.forEach(p=>{p.condition=clamp(p.condition+5,0,100);p.injury=Math.max(0,p.injury-1)});if(S.day%7===0)advanceMonth();if(S.day%30===0)S.budget+=10;story('一日が過ぎた。選手たちはそれぞれの目標を胸に、グラウンドへ向かう。');tab('home')}
function graduate(){let grads=S.team.filter(p=>p.year===3);let count=grads.length;S.team=S.team.filter(p=>p.year!==3);S.team.forEach(p=>p.year++);let newCount=Math.max(8,18-S.team.length);for(let i=0;i<newCount;i++)S.team.push(player(i,1));S.year++;S.morale=clamp(S.morale-8,20,100);story(`卒業式。${count}人の3年生がグラウンドを去った。新入生${newCount}人を迎え、新しい世代の挑戦が始まる。`)}
function upgrade(){if(S.budget<60){alert('部費が足りません。練習や日程を進めてください。');return}S.budget-=60;S.facilities++;S.rep=clamp(S.rep+2,0,100);story(`OB会の協力もあり、練習設備がLv.${S.facilities}に強化された。`);tab('schedule')}
function startTournament(name){if(S.tournament&&S.tournament.phase!=='closed'&&S.tournament.phase!=='champion'){if(!confirm('現在の大会を終了して新しい大会に進みますか？'))return}let rounds=name==='夏の県大会'?4:3;S.tournament={name,round:1,totalRounds:rounds,roundName:'1回戦',phase:'ready',opponent:'',opponentPower:0,homeScore:0,awayScore:0,inning:1,half:'top',outs:0,bases:[false,false,false,false],log:[],runs:[0,0],summary:'',champion:false};nextOpponent();story(`${name}の組み合わせが決まった。ここからは一戦必勝。`);tab('match')}
function nextOpponent(){let pool=S.schools.slice().sort(()=>Math.random()-.5);let s=pool[Math.floor(Math.random()*pool.length)];S.tournament.opponent=s.name;S.tournament.opponentPower=s.power+Math.floor(Math.random()*11)-5;S.tournament.phase='ready';S.tournament.homeScore=0;S.tournament.awayScore=0;S.tournament.inning=1;S.tournament.half='top';S.tournament.outs=0;S.tournament.bases=[false,false,false,false];S.tournament.runs=[0,0];S.tournament.log=[];S.tournament.roundName=['1回戦','2回戦','準々決勝','準決勝','決勝'][Math.min(S.tournament.round-1,4)]}
function beginMatch(){let t=S.tournament;t.phase='playing';t.log.push(`プレイボール！ ${S.school} 対 ${t.opponent}。`);t.log.push('スタンドの応援を背に、試合が始まった。');tab('match')}
function playBall(action){let t=S.tournament;if(!t||t.phase!=='playing')return;let isUs=t.half==='bottom';let batting= isUs?lineup():null;let batter=batting?batting[(t.inning*3+t.outs)%batting.length]:null;let pwr=batter?batter.bat+batter.power/2:overall();let opp=t.opponentPower;let roll=Math.random()*100;let log='';
if(action==='relief'){S.team.filter(p=>p.pos==='投').forEach(p=>p.condition=clamp(p.condition+3,0,100));log='投手交代。ブルペンから新しい投手がマウンドへ。';}
else if(action==='bunt'&&isUs){if(roll<62){if(t.bases[1]){t.bases[2]=true;t.bases[1]=false}t.outs++;log='送りバント成功。走者を進めた！';}else{t.outs++;log='バントが小フライに。アウト。';}}
else if(action==='steal'&&isUs){if(t.bases[1]&&roll<55){t.bases[2]=true;t.bases[1]=false;log='盗塁成功！得点圏に走者を進めた。'}else if(t.bases[1]){t.outs++;t.bases[1]=false;log='盗塁失敗。タッチアウト！'}else log='走者がいない。仕掛けることができない。';}
else {let hitChance=clamp(25+(pwr-opp)*.45+(action==='swing'?9:0),12,48);if(roll<hitChance){if(roll<hitChance*.18){let scored=t.bases.filter(Boolean).length+1;addRuns(t,isUs,scored);t.bases=[false,false,false,false];log='痛烈な当たりはスタンドへ！ホームラン！';}
else{let scored=t.bases[3]?1:0;if(t.bases[2])scored++;t.bases[3]=t.bases[2];t.bases[2]=t.bases[1];t.bases[1]=true;addRuns(t,isUs,scored);log= scored?'タイムリーヒット！走者がホームイン！':'ヒット！ランナーが出た。';}}
else if(roll<hitChance+22){t.outs++;log=roll%2<1?'空振り三振！':'打ち上げてしまった。アウト。';}
else{t.outs++;log='内野ゴロ。守備の正面をついた。';}}
t.log.push(`${t.inning}回${t.half==='top'?'表':'裏'}：${log}`);if(t.log.length>40)t.log.shift();
if(t.outs>=3){t.outs=0;t.bases=[false,false,false,false];if(t.half==='top'){t.half='bottom';t.log.push('攻守交代。次はみどり野高校の攻撃！')}else{t.half='top';t.inning++;t.log.push('攻守交代。次のイニングへ。')}}if(t.inning>9|| (t.inning===9&&t.half==='top'&&t.homeScore>t.awayScore)){endGame()}else if(t.inning>9&&t.homeScore!==t.awayScore){endGame()}save();tab('match')}
function addRuns(t,isUs,n){if(isUs)t.homeScore+=n;else t.awayScore+=n}
function endGame(){let t=S.tournament;if(t.inning<9&&t.homeScore>t.awayScore){t.phase='playing';return}if(t.homeScore===t.awayScore&&t.inning<=9){t.inning=10;t.half='top';t.log.push('同点のまま延長戦へ！');return}let won=t.homeScore>t.awayScore;if(won){S.seasonWins++;S.rep=clamp(S.rep+3,0,100);S.morale=clamp(S.morale+5,0,100);S.budget+=8;t.summary=`勝利！ ${t.homeScore}－${t.awayScore}。選手たちは校歌を歌い、次の試合へ進む。`;S.records.unshift(`${t.name} ${t.roundName} 勝利 ${t.homeScore}-${t.awayScore}`);story(`${t.opponent}に${t.homeScore}対${t.awayScore}で勝利。選手たちは確かな自信を手にした。`);t.phase='done';}else{S.seasonLosses++;S.rep=clamp(S.rep-2,0,100);S.morale=clamp(S.morale-8,0,100);t.summary=`敗退。 ${t.homeScore}－${t.awayScore}。悔しさを胸に、チームは次のシーズンを目指す。`;S.records.unshift(`${t.name} ${t.roundName} 敗退 ${t.homeScore}-${t.awayScore}`);story(`${t.opponent}に敗れ、${t.name}はここで終わった。涙を流す3年生と、来年を見据える下級生。`);t.phase='eliminated';}
if(t.name==='夏の県大会'&&won&&t.round>=t.totalRounds){t.phase='done';t.summary='夏の県大会優勝！みどり野高校が県代表として甲子園への切符をつかんだ！';t.koshien=true;story('夏の県大会を制覇！夢の甲子園出場が決まった。全国の強豪との戦いが待っている。');}
if(t.name==='甲子園'&&won&&t.round>=t.totalRounds){t.phase='champion';S.wonKoshien++;S.champion=true;t.summary='全国制覇！長い戦いの末、みどり野高校が甲子園の頂点に立った！';story('歓喜の瞬間。みどり野高校、甲子園優勝！この夏の物語は、学校の歴史に刻まれた。');}}
function continueTournament(){let t=S.tournament;if(t.koshien){S.tournament={name:'甲子園',round:1,totalRounds:6,roundName:'1回戦',phase:'ready',homeScore:0,awayScore:0,inning:1,half:'top',outs:0,bases:[false,false,false,false],runs:[0,0],log:[],summary:'全国の代表校が集結。ここからは全国制覇への道。'};nextOpponent();S.tournament.name='甲子園';story('甲子園初戦。全国の代表校が集まる聖地で、みどり野高校の挑戦が始まる。');tab('match');return}
if(t.phase==='eliminated'||t.phase==='champion'){t.phase='closed';tab('home');return}if(t.round>=t.totalRounds){t.phase='closed';tab('home');return}t.round++;nextOpponent();story(`${t.roundName}。次の相手は${t.opponent}。`);tab('match')}
function finishTournament(){let t=S.tournament;if(t.name==='春季県大会'&&t.phase==='done'&&t.round>=t.totalRounds){t.phase='closed'}else if(t.phase==='champion')t.phase='closed';else t.phase='closed';tab('home')}
function tab(t){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
render();
</script>

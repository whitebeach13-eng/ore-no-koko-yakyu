<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>高校野球 2Dアニメ試作</title><style>*{box-sizing:border-box}body{margin:0;background:#101b30;color:#fff;font-family:system-ui,'Noto Sans JP',sans-serif}.wrap{max-width:720px;margin:auto;padding:12px}h1{font-size:20px;margin:6px 0}.note{font-size:12px;color:#b8c9df;margin:6px 0 12px}.board{background:#213956;border:2px solid #6d879e;border-radius:12px;overflow:hidden;position:relative}canvas{display:block;width:100%;aspect-ratio:4/3;touch-action:manipulation}.status{padding:10px;background:#0d2439;font-size:14px;min-height:46px}button{background:#225d9a;color:white;border:1px solid #7da5cf;border-radius:10px;padding:12px 10px;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.options{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:14px}select{background:#263e5d;color:#fff;border-radius:8px;padding:7px}.hint{font-size:12px;color:#b9cce1;line-height:1.7;margin-top:12px}</style></head><body><div class="wrap"><h1>⚾ 高校野球・試合アニメ試作品</h1><div class="note">オリジナル2D演出の技術デモ（本編第49版とは別ファイル）</div><div class="board"><canvas id="c" width="720" height="540"></canvas><div class="status" id="status">下のボタンを押すと選手が動きます。</div></div><div class="controls"><button onclick="play('hit')">⚾ ヒット</button><button onclick="play('ground')">🧤 ゴロアウト</button><button onclick="play('fly')">☁️ 外野フライ</button><button onclick="play('steal')">🏃 盗塁</button><button onclick="play('homer')">🔥 ホームラン</button><button onclick="play('bunt')">🥎 送りバント</button></div><div class="options"><label>速度 <select id="speed"><option value="1">通常</option><option value="1.8">高速</option><option value="3">超高速</option></select></label><button onclick="reset()">↻ リセット</button></div><div class="hint">投球・スイング・打球・捕球・送球・走塁を、スマホ上で実際に動かすデモです。動きは簡略化しています。今後、本編の試合結果と連動させる構想です。</div></div><script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),status=document.getElementById('status');let action='',start=0,raf=0,rate=1;const P={home:[360,452],first:[510,310],second:[360,172],third:[210,310],pitcher:[360,305],short:[280,242],left:[175,150],center:[360,92],right:[545,150]};
function lerp(a,b,t){return a+(b-a)*Math.max(0,Math.min(1,t))}function path(points,t){let n=points.length-1,k=Math.min(n-1,Math.floor(t*n)),f=t*n-k;return [lerp(points[k][0],points[k+1][0],f),lerp(points[k][1],points[k+1][1],f)]}function text(t,x,y,size=16,color='#fff'){ctx.fillStyle=color;ctx.font=`bold ${size}px system-ui`;ctx.textAlign='center';ctx.fillText(t,x,y)}function player(x,y,color='#fff',bat=false,pose=0){ctx.save();ctx.translate(x,y);ctx.strokeStyle='#0b2238';ctx.lineWidth=3;ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(0,4,10,13,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#ffdbad';ctx.beginPath();ctx.arc(0,-14,8,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.strokeStyle=color;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-5,15);ctx.lineTo(-8+pose*4,27);ctx.moveTo(5,15);ctx.lineTo(8-pose*4,27);ctx.stroke();if(bat){ctx.strokeStyle='#dfb16d';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(8,-3);ctx.lineTo(22+pose*25,-32+pose*37);ctx.stroke()}ctx.restore()}
function field(){ctx.fillStyle='#286e43';ctx.fillRect(0,0,720,540);ctx.fillStyle='#347e4e';for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(360,450,120+i*85,Math.PI*1.02,Math.PI*1.98);ctx.strokeStyle=i%2?'#31774a':'#3e8a55';ctx.lineWidth=25;ctx.stroke()}ctx.fillStyle='#b58a54';ctx.beginPath();ctx.moveTo(360,468);ctx.lineTo(124,235);ctx.quadraticCurveTo(360,12,596,235);ctx.closePath();ctx.fill();ctx.fillStyle='#397e49';ctx.beginPath();ctx.moveTo(...P.home);ctx.lineTo(...P.first);ctx.lineTo(...P.second);ctx.lineTo(...P.third);ctx.closePath();ctx.fill();ctx.strokeStyle='#f2e7c7';ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.moveTo(360,468);ctx.lineTo(85,185);ctx.moveTo(360,468);ctx.lineTo(635,185);ctx.stroke();ctx.fillStyle='#fff';for(let key of ['first','second','third']){let [x,y]=P[key];ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.fillRect(-7,-7,14,14);ctx.restore()}ctx.fillRect(352,448,16,5);ctx.fillStyle='#bd925c';ctx.beginPath();ctx.arc(360,305,18,0,Math.PI*2);ctx.fill();text('HOME',360,520,13,'#fff9c6')}
function ball(x,y){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d13c35';ctx.lineWidth=1.5;ctx.stroke()}
function draw(ms=0){field();let t=Math.max(0,ms/1000);let swing=action&&t>.65&&t<1.05?Math.min(1,(t-.65)*4):0;let players={pitcher:P.pitcher,short:P.short,left:P.left,center:P.center,right:P.right};let runner=null,flyball=null;const set=(name,pt)=>players[name]=pt;const motion=(pts,a,b)=>path(pts,Math.max(0,Math.min(1,(t-a)/(b-a))));if(action==='hit'){if(t>1){set('center',motion([P.center,[380,125],[400,150]],1,2.1));runner=motion([[374,444],P.first],1.1,3.4)}if(t>.9&&t<2.4)flyball=motion([[380,424],[420,290],[400,145]],.9,2.4)}if(action==='ground'){if(t>1)set('short',motion([P.short,[315,285]],1,2));if(t>1.1&&t<2.1)flyball=motion([[370,435],[315,285]],1.1,2.1);if(t>=2.1&&t<2.85)flyball=motion([[315,285],P.first],2.1,2.85);if(t>1.15)runner=motion([[374,444],P.first],1.15,3.3)}if(action==='fly'){if(t>1)set('left',motion([P.left,[220,100]],1,2.9));if(t>.9&&t<2.9)flyball=motion([[350,430],[300,260],[220,100]],.9,2.9)}if(action==='steal'){runner=motion([P.first,P.second],.55,2.7);if(t>.3&&t<.9)flyball=motion([P.pitcher,P.home],.3,.9);if(t>1.1&&t<2.6)flyball=motion([P.home,P.second],1.1,2.6)}if(action==='homer'){if(t>.9&&t<2.5)flyball=motion([[370,435],[490,245],[615,38]],.9,2.5);if(t>1)runner=motion([[374,444],P.first,P.second,P.third,P.home],1,6.7)}if(action==='bunt'){if(t>.9&&t<2)flyball=motion([[370,435],[385,390]],.9,2);if(t>1.1)set('pitcher',motion([P.pitcher,[385,390]],1.1,2.2));if(t>2.2&&t<3.1)flyball=motion([[385,390],P.first],2.2,3.1);if(t>1.1)runner=motion([[374,444],P.first],1.1,3.2)}for(let [name,pt] of Object.entries(players))player(pt[0],pt[1],name==='pitcher'?'#f3f3f5':'#cce5fb',false,Math.sin(t*12)*.15);player(374,444,'#ffe269',true,swing);if(action==='steal'&&t<.5)player(...P.first,'#ffe269');if(runner)player(...runner,'#ffe269',false,Math.sin(t*22)*.6);if(action&&t<.9&&action!=='steal')ball(...motion([P.pitcher,[360,418]],.2,.9));if(flyball)ball(...flyball);if(action==='steal'&&t>=.3&&t<2.6&&flyball)ball(...flyball);if(action&&t>.9&&t<1.18&&action!=='steal')text('カキーン！',480,385,25,'#ffe56e');}
const durations={hit:3600,ground:3500,fly:3100,steal:3000,homer:7000,bunt:3400},labels={hit:'センター前ヒット！ 打者走者が一塁へ',ground:'遊撃手が捕球、一塁へ送球！ アウト！',fly:'左翼手が落下地点へ！ フライアウト',steal:'一塁走者がスタート！ 二塁へ盗塁！',homer:'大きな当たり！ ホームラン！',bunt:'送りバント！ 投手が捕球して一塁送球'};function play(name){cancelAnimationFrame(raf);action=name;rate=Number(document.getElementById('speed').value);start=performance.now();status.textContent=labels[name];const tick=now=>{let ms=(now-start)*rate;draw(ms);if(ms<durations[name])raf=requestAnimationFrame(tick);else{status.textContent+='　／ 演出終了';action=''}};raf=requestAnimationFrame(tick)}function reset(){cancelAnimationFrame(raf);action='';draw();status.textContent='下のボタンを押すと選手が動きます。'}draw();
</script></body></html>

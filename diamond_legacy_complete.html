<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09172d"><title>甲子園への軌跡 — 高校野球監督ゲーム</title><style>
:root{--bg:#081426;--card:#122844;--line:#375777;--gold:#ffd56e;--ink:#e8f2ff;--muted:#b7c9df;--green:#37d7a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#215279,#081426 55%);color:var(--ink);font-family:system-ui,'Noto Sans JP',sans-serif;font-size:15px}button,select,input{font:inherit}button{cursor:pointer;border:1px solid #7aa5d3;color:white;border-radius:11px;background:linear-gradient(#25598e,#16365e);padding:11px 12px;font-weight:750;min-height:43px}button:disabled{opacity:.4;cursor:default}.gold{background:linear-gradient(#f8d16b,#c78a2c);color:#16263a;border-color:#ffe7a7}.small{padding:6px 9px;min-height:32px;font-size:12px}.danger{background:#713d4d}.wrap{max-width:850px;margin:auto;padding:12px 12px 80px}header{padding:20px 12px 10px;text-align:center}header h1{margin:0;color:var(--gold);font-size:27px;letter-spacing:2px;text-shadow:0 2px 12px #b57c3e80}header p{color:var(--muted);margin:7px 0 0;font-size:12px}.top{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;background:#0d223b;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;position:sticky;top:0;z-index:4;background:#09172de8;padding:8px 0;backdrop-filter:blur(7px)}.tabs button{padding:10px 3px;font-size:13px}.tabs button.on{background:linear-gradient(#e9c26a,#b8862d);color:#13263e}.panel{background:linear-gradient(145deg,#142d4b,#0c1d35);border:1px solid #476688;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 8px 30px #0003}.panel h2{color:var(--gold);font-size:19px;margin:0 0 12px}.panel h3{font-size:16px;margin:16px 0 8px;color:#b9e8ff}.muted{color:var(--muted)}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.metric{background:#1c3b5e;border-radius:11px;padding:12px;text-align:center}.metric b{color:var(--gold);display:block;font-size:21px}.list{display:grid;gap:7px}.person{background:#1b3859;border:1px solid #426388;border-radius:10px;padding:9px}.person strong{color:#fff}.badge{border-radius:20px;padding:3px 8px;background:#244e76;color:#d9ecff;font-size:12px}.good{color:#ffab8d}.mid{color:#9be9a6}.low{color:#9cc7ff}.pitch{background:#0a1c32;border-radius:14px;padding:10px;overflow:hidden}.field{height:180px;position:relative;background:repeating-linear-gradient(90deg,#27764e 0 26px,#2d8154 26px 52px);border-radius:95px 95px 12px 12px;border:4px solid #d4c083;overflow:hidden}.diamond{position:absolute;top:58px;left:50%;width:96px;height:96px;transform:translateX(-50%) rotate(45deg);background:#b38a57;border:3px solid #e9d9b1}.base{position:absolute;width:12px;height:12px;background:white;border:1px solid #9aa8ac}.b1{right:-7px;top:-7px}.b2{left:-7px;top:-7px}.b3{left:-7px;bottom:-7px}.home{right:-7px;bottom:-7px}.ball{position:absolute;left:calc(50% - 6px);top:100px;width:12px;height:12px;background:white;border-radius:50%;box-shadow:0 0 10px #fff;animation:fly 1.1s ease-in-out infinite alternate}@keyframes fly{to{transform:translate(18px,-34px) scale(.7)}}.crowd{height:17px;background:repeating-linear-gradient(90deg,#e2b65c 0 3px,#376fb0 3px 6px,#c54e50 6px 9px,#72a8ba 9px 12px);opacity:.85}.score{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}.score th,.score td{border:1px solid #476688;text-align:center;padding:7px 1px}.score th:first-child,.score td:first-child{width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score th{color:var(--gold);background:#183657}.score td{background:#0d2039}.score .total{background:#29496b;color:var(--gold);font-weight:bold}.log{max-height:220px;overflow:auto;background:#08192d;padding:10px;border-radius:9px;font-size:13px;line-height:1.8}.log p{margin:3px 0;border-bottom:1px solid #203b58}.choice{width:100%;padding:10px;border:1px solid #7195b8;background:#102944;color:white;border-radius:8px}.hidden{display:none!important}.tiny{font-size:12px}.separator{border-top:1px solid #3b5877;margin:12px 0}.stat{width:100%;border-collapse:collapse;font-size:12px}.stat th,.stat td{padding:7px 3px;border-bottom:1px solid #34516e;text-align:center}.stat th:first-child,.stat td:first-child{text-align:left}.pill{background:#235274;border-radius:8px;padding:4px 8px;font-size:12px}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff1bf;color:#13263e;padding:11px 17px;border-radius:12px;box-shadow:0 5px 25px #0009;z-index:30;max-width:90%;display:none}select,input{background:#0b2037;color:white;border:1px solid #6e90b5;border-radius:8px;padding:8px;max-width:100%}details summary{cursor:pointer;color:var(--gold);font-weight:bold;padding:6px 0}.result{border:2px solid #d5ae61;border-radius:12px;padding:13px;background:#122a43}.result h2{text-align:center}footer{text-align:center;color:#8ea7c4;font-size:11px;padding:15px}@media(max-width:380px){.tabs button{font-size:11px}.score{font-size:10px}.score th:first-child,.score td:first-child{width:64px}.panel{padding:10px}}
</style></head><body><header><h1>⚾ 甲子園への軌跡</h1><p>育成 × 采配 × 高速試合　｜　独立新作・オフライン対応</p></header><main class="wrap"><div id="app"></div><footer>このゲームは独自制作の高校野球シミュレーションです。端末内に自動保存します。</footer></main><div id="toast"></div><script>
'use strict';
const NAMES1=['佐藤','鈴木','高橋','田中','伊藤','渡辺','山本','中村','小林','加藤','吉田','山田','佐々木','山口','松本','井上','木村','林','清水','斎藤','池田','橋本','石川','前田','藤田','岡田','長谷川','森','阿部','福田'];
const NAMES2=['翔太','悠真','大翔','蓮','湊','陽翔','颯太','健太','直樹','龍之介','海斗','優斗','大輝','拓海','一真','航平','悠斗','晴人','蒼','瑛太','翔','駿','優希','陸','翼'];
const SCHOOLS=['北九州商業','筑紫学園','博多中央','小倉南','福岡西陵','八幡工業','久留米南','飯塚東','直方学院','宗像高校','大牟田東','糸島高校','東福岡北','筑後実業','門司高校','嘉穂学園'];
const TRAIN=['打撃','長打','走力','守備','投球','制球'];
const SKILLS=['バント○','盗塁○','チャンス○','対左投手○','守備職人','奪三振','キレ○'];
const KEY='diamond_legacy_new_game_v1';
const $=id=>document.getElementById(id); const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));const rng=(a,b)=>a+Math.floor(Math.random()*(b-a+1));const pick=a=>a[rng(0,a.length-1)];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let G=null,view='home',lastMatch=null,activePlayer=0;
function blankStats(){return{g:0,pa:0,ab:0,h:0,d2:0,d3:0,hr:0,rbi:0,r:0,bb:0,so:0,sac:0,sb:0,pG:0,outs:0,ph:0,pbb:0,pso:0,per:0,pr:0,w:0,l:0,sv:0,xp:0}}
function makePlayer(year){let pos=['投','捕','一','二','三','遊','左','中','右'][rng(0,8)];let p={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),name:pick(NAMES1)+pick(NAMES2),year,pos,hit:rng(26,70),power:rng(25,70),run:rng(24,72),field:rng(25,72),pitch:rng(25,75),control:rng(25,75),stamina:rng(28,76),train:rng(0,5),skill:Math.random()<.2?[pick(SKILLS)]:[],stats:blankStats()};if(pos==='投'){p.pitch+=12;p.control+=8;p.stamina+=10}return p}
function fresh(){let school=prompt('高校名を入力してください（空欄なら「青嵐高校」）','青嵐高校');if(school===null)return;school=school.trim().slice(0,24)||'青嵐高校';G={school,year:2026,month:4,day:1,prestige:20,wins:0,losses:0,trophies:0,history:[],graduates:[],players:[],lineup:[],bench:[],policy:{hit:'バランス',run:'普通',pitch:'継投重視'},schedule:[],lastResult:null,seq:0};for(let y=1;y<=3;y++)for(let i=0;i<rng(7,9);i++)G.players.push(makePlayer(y));setLineup();buildSchedule();save();view='home';render()}
function setLineup(){let selected=[],pitcher=G.players.find(p=>p.pos==='投')||G.players[0];selected.push(pitcher.id);let sorted=G.players.filter(p=>p.id!==pitcher.id).sort((a,b)=>b.hit+b.field-a.hit-a.field);for(let p of sorted){if(selected.length>=9)break;selected.push(p.id)}G.lineup=selected;G.bench=G.players.filter(p=>!selected.includes(p.id)).map(p=>p.id).slice(0,11)}
function buildSchedule(){G.schedule=[];let months=[[4,19,'春季県大会'],[5,17,'練習試合'],[6,14,'練習試合'],[7,12,'夏季県大会'],[8,9,'夏の甲子園'],[9,13,'秋季県大会'],[10,11,'練習試合'],[11,15,'練習試合'],[3,14,'春の選抜']];for(let [m,d,title] of months){if((title==='夏の甲子園'||title==='春の選抜')&&G.prestige<35)continue;G.schedule.push({year:m<4?G.year+1:G.year,month:m,day:d,title,done:false})}}
function dateNum(y,m,d){return y*372+m*31+d}function todayNum(){return dateNum(G.year,G.month,G.day)}function nextEvent(){return G.schedule.filter(x=>!x.done&&dateNum(x.year,x.month,x.day)>=todayNum()).sort((a,b)=>dateNum(a.year,a.month,a.day)-dateNum(b.year,b.month,b.day))[0]}
function isToday(){return G.schedule.find(x=>!x.done&&x.year===G.year&&x.month===G.month&&x.day===G.day)}
function save(){if(G)localStorage.setItem(KEY,JSON.stringify(G))}function load(){try{let g=JSON.parse(localStorage.getItem(KEY));if(g&&g.players&&g.lineup){G=g;return true}}catch(e){}return false}function toast(s){let e=$('toast');e.textContent=s;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',2800)}
function nav(to){view=to;render();window.scrollTo({top:0,behavior:'instant'})}
function header(){let ev=nextEvent(),remain=ev?dateNum(ev.year,ev.month,ev.day)-todayNum():null;return `<div class="top"><div><b style="color:var(--gold)">${esc(G.school)}</b><div class="muted tiny">${G.year}年${G.month}月${G.day}日 ／ 名門度 ${G.prestige}</div></div><div class="row"><span class="badge">通算 ${G.wins}勝${G.losses}敗</span><button class="small" onclick="save();toast('セーブしました')">💾 保存</button></div></div><nav class="tabs">${[['home','🏠 監督'],['roster','👥 選手'],['training','💪 練習'],['records','🏆 記録']].map(([id,t])=>`<button class="${view===id?'on':''}" onclick="nav('${id}')">${t}</button>`).join('')}</nav>`}
function home(){let ev=nextEvent(),now=isToday();return `<section class="panel"><h2>📅 監督室</h2><div class="grid3"><div class="metric">チーム人数<b>${G.players.length}</b></div><div class="metric">通算勝利<b>${G.wins}</b></div><div class="metric">優勝<b>${G.trophies}</b></div></div><h3>次の試合</h3><div class="person">${ev?`<b>${esc(ev.title)}</b> ／ ${ev.month}月${ev.day}日 ${remainDays(ev)}<br><small class="muted">${ev.title==='練習試合'?'練習試合':'公式戦'}・試合前の采配方針が反映されます</small>`:'今季の予定は終了しました'}</div><div class="grid2" style="margin-top:10px"><button class="gold" onclick="advance(1)">📅 1日進める</button><button onclick="advance(7)">⏩ 7日進める</button></div>${now?`<button class="gold" style="width:100%;margin-top:10px" onclick="nav('game')">⚾ ${esc(now.title)}を開始</button>`:''}<h3>今季の予定</h3><div class="list">${G.schedule.filter(x=>x.year===G.year).map(x=>`<div class="person tiny">${x.month}/${x.day}　${esc(x.title)}　${x.done?'✓ 終了':(x.year===G.year&&x.month===G.month&&x.day===G.day?'★ 本日':'')}</div>`).join('')}</div></section><section class="panel"><h2>🎯 チーム方針</h2>${policyUI()}<p class="muted tiny">試合前に決めた方針を、打撃・走塁・投手起用に反映します。</p></section>${G.lastResult?`<section class="panel"><h2>直近の試合</h2><div class="person">${esc(G.lastResult.title)}：${G.lastResult.homeRuns} − ${G.lastResult.awayRuns}　${G.lastResult.win?'勝利':'敗戦'}</div><button style="margin-top:8px" onclick="view='result';render()">📋 結果を詳しく見る</button></section>`:''}`}
function remainDays(ev){let diff=dateNum(ev.year,ev.month,ev.day)-todayNum();return diff===0?'【本日】':`【あと${diff}日】`}
function policyUI(){return `<div class="grid3">${[['hit','打撃',['バランス','ミート','長打','小技']],['run','走塁',['普通','積極','慎重']],['pitch','投手起用',['継投重視','完投重視']]].map(([key,label,opts])=>`<label class="tiny">${label}<select class="choice" onchange="G.policy.${key}=this.value;save()">${opts.map(x=>`<option ${G.policy[key]===x?'selected':''}>${x}</option>`).join('')}</select></label>`).join('')}</div>`}
function advance(n){if(isToday()){toast('本日の試合を先に開始してください');return}for(let k=0;k<n;k++){if(isToday())break;for(let p of G.players){let a=TRAIN[p.train];let attr={打撃:'hit',長打:'power',走力:'run',守備:'field',投球:'pitch',制球:'control'}[a];p[attr]=clamp(p[attr]+(Math.random()<.085?.5:0),1,99)}G.day++;let max=new Date(G.year,G.month,0).getDate();if(G.day>max){G.day=1;G.month++;if(G.month>12){G.month=1;G.year++}}if(G.month===4&&G.day===1){graduate();buildSchedule()}if(isToday())break}save();render();if(isToday())toast('⚾ 本日は試合日です！')}
function graduate(){let old=G.players.filter(p=>p.year===3);for(let p of old)G.graduates.push({year:G.year,name:p.name,pos:p.pos,stats:p.stats});G.players=G.players.filter(p=>p.year!==3);G.players.forEach(p=>p.year++);let n=clamp(5+Math.floor(G.prestige/15)+rng(-2,2),4,15);for(let i=0;i<n;i++)G.players.push(makePlayer(1));setLineup();toast(`新入生${n}名が入部しました`)}
function roster(){return `<section class="panel"><h2>👥 スタメン・打順</h2><p class="muted tiny">打順を選択して選手を変更できます。投手は1番の選手とは限りません。</p><div class="list">${G.lineup.map((id,i)=>{let p=player(id);return `<div class="person row between"><div><span class="badge">${i+1}番</span> <strong>${esc(p?.name||'未設定')}</strong> <small>${p?.year}年 ${p?.pos}</small></div><select aria-label="${i+1}番の選手" onchange="changeLineup(${i},this.value)">${G.players.map(q=>`<option value="${q.id}" ${q.id===id?'selected':''}>${esc(q.name)} ${q.pos}</option>`).join('')}</select></div>`}).join('')}</div><button style="margin-top:9px" onclick="setLineup();save();render()">おすすめ打順に戻す</button><h3>選手一覧（${G.players.length}名）</h3>${playersList()}</section>`}
function changeLineup(i,id){let j=G.lineup.indexOf(id);if(j>=0){[G.lineup[i],G.lineup[j]]=[G.lineup[j],G.lineup[i]]}else G.lineup[i]=id;G.bench=G.players.filter(p=>!G.lineup.includes(p.id)).map(p=>p.id).slice(0,11);save();render()}
function player(id){return G.players.find(p=>p.id===id)}function playersList(){return `<div class="list">${[...G.players].sort((a,b)=>b.year-a.year).map(p=>`<details class="person"><summary>${p.year}年 ${p.pos} ${esc(p.name)} <span class="badge">打${Math.round(p.hit)} 長${Math.round(p.power)} 走${Math.round(p.run)}</span></summary><div class="grid3">${[['打撃',p.hit],['長打',p.power],['走力',p.run],['守備',p.field],['投球',p.pitch],['制球',p.control]].map(([k,v])=>`<div class="metric tiny">${k}<b class="${v>=70?'good':v>=45?'mid':'low'}">${Math.round(v)}</b></div>`).join('')}</div><p class="tiny">アビリティ：${p.skill.join('、')||'なし'} ／ 試合経験 ${p.stats.xp}</p><p class="tiny">通算：${p.stats.g}試合 ${p.stats.h}安打 ${p.stats.hr}本塁打 ${p.stats.rbi}打点　投球 ${Math.floor(p.stats.outs/3)}回${p.stats.outs%3}/3</p></details>`).join('')}</div>`}
function training(){return `<section class="panel"><h2>💪 個別練習</h2><p class="muted">選手ごとに練習内容を指定。日付を進めると少しずつ成長します。</p><div class="list">${[...G.players].sort((a,b)=>b.year-a.year).map(p=>`<div class="person row between"><div><strong>${esc(p.name)}</strong><div class="tiny muted">${p.year}年 ${p.pos}｜打${Math.round(p.hit)} 長${Math.round(p.power)} 投${Math.round(p.pitch)}</div></div><select onchange="player('${p.id}').train=+this.value;save()">${TRAIN.map((x,i)=>`<option value="${i}" ${i===p.train?'selected':''}>${x}</option>`).join('')}</select></div>`).join('')}</div></section>`}
function records(){let h=G.history;return `<section class="panel"><h2>🏆 監督の記録</h2><div class="grid3"><div class="metric">勝利<b>${G.wins}</b></div><div class="metric">敗戦<b>${G.losses}</b></div><div class="metric">名門度<b>${G.prestige}</b></div></div><h3>試合履歴</h3><div class="list">${h.slice().reverse().slice(0,30).map(x=>`<div class="person tiny">${x.year}/${x.month}/${x.day}　${esc(x.title)}　${x.homeRuns}−${x.awayRuns}　${x.win?'○ 勝':'● 敗'}</div>`).join('')||'まだ試合記録がありません'}</div><h3>選手の通算成績</h3><div style="overflow-x:auto"><table class="stat"><thead><tr><th>選手</th><th>試合</th><th>打数</th><th>安打</th><th>本</th><th>打点</th><th>投球回</th></tr></thead><tbody>${G.players.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.stats.g}</td><td>${p.stats.ab}</td><td>${p.stats.h}</td><td>${p.stats.hr}</td><td>${p.stats.rbi}</td><td>${Math.floor(p.stats.outs/3)}.${p.stats.outs%3}</td></tr>`).join('')}</tbody></table></div><h3>卒業生 ${G.graduates.length}名</h3><details><summary>歴代卒業生を表示</summary><div class="list">${G.graduates.slice().reverse().map(p=>`<div class="person tiny">${p.year}年卒 ${esc(p.name)}　${p.stats.g}試合 ${p.stats.h}安打</div>`).join('')||'卒業生はいません'}</div></details></section><section class="panel"><h2>💾 データ管理</h2><div class="row"><button onclick="exportSave()">セーブを書き出す</button><button onclick="$('importFile').click()">セーブを読み込む</button><input id="importFile" type="file" accept="application/json,.json" style="display:none" onchange="importSave(event)"></div><p class="muted tiny">ブラウザの保存データが消える場合に備え、JSON形式でバックアップできます。</p><button class="danger" onclick="if(confirm('新しい高校で最初から始めますか？現在のセーブは上書きされます。'))fresh()">最初から始める</button></section>`}
function exportSave(){let a=document.createElement('a'),b=new Blob([JSON.stringify(G)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='koshien_save_'+G.year+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function importSave(e){let f=e.target.files[0];if(!f)return;f.text().then(s=>{let o=JSON.parse(s);if(!o.players||!o.lineup||!o.school)throw Error('形式が違います');G=o;save();nav('home');toast('セーブを読み込みました')}).catch(()=>alert('セーブを読み込めませんでした'))}
// Fresh match engine: plate appearances and pitcher outs are recorded in a single source of truth.
function createMatch(){let ev=isToday();if(!ev)return null;let starters=G.lineup.map(player).filter(Boolean);if(starters.length!==9){toast('スタメンは9人必要です');return null}let opponent=pick(SCHOOLS.filter(s=>s!==G.school));let ourHome=Math.random()<.5;let opp=Array.from({length:9},()=>({name:pick(NAMES1)+pick(NAMES2),hit:rng(28,73),power:rng(25,70),run:rng(25,75),field:rng(25,70),pitch:rng(30,73),control:rng(30,72),stamina:rng(30,72),skill:[]}));let ourPitch=starters.find(p=>p.pos==='投')||G.players.find(p=>p.pos==='投')||starters[0];let oppPitch=opp[8];return{ev,opponent,ourHome,teams:[{name:ourHome?opponent:G.school,players:ourHome?opp:starters},{name:ourHome?G.school:opponent,players:ourHome?starters:opp}],ourIndex:ourHome?1:0,inning:1,half:0,score:[Array(12).fill(null),Array(12).fill(null)],hits:[0,0],errors:[0,0],logs:[],batIndex:[0,0],runs:[0,0],batStats:new Map(),pitchStats:new Map(),pitchers:[ourHome?oppPitch:ourPitch,ourHome?ourPitch:oppPitch],finished:false,outsByTeam:[0,0]}}
function ensureBat(M,p){if(!M.batStats.has(p))M.batStats.set(p,{pa:0,ab:0,h:0,d2:0,d3:0,hr:0,rbi:0,r:0,bb:0,so:0,sac:0,sb:0});return M.batStats.get(p)}function ensurePitch(M,p){if(!M.pitchStats.has(p))M.pitchStats.set(p,{outs:0,h:0,bb:0,so:0,r:0,er:0,appear:1}) ;return M.pitchStats.get(p)}
function atBat(M,team,defense,bases,outs){let offense=M.teams[team],batter=offense.players[M.batIndex[team]%9],pitcher=M.pitchers[defense],bs=ensureBat(M,batter),ps=ensurePitch(M,pitcher);M.batIndex[team]++;bs.pa++;let skill=batter.skill||[],hit=clamp(.19+(batter.hit-pitcher.pitch)*.0022+(skill.includes('チャンス○')&&bases.some(Boolean)?.025:0)+(team===M.ourIndex&&G.policy.hit==='ミート'?.04:0),.10,.39);let walk=clamp(.075+(pitcher.control<45?.025:0),.03,.13);let roll=Math.random(),kind='out',rbi=0,earned=0,outsMade=0;
function scoreRunner(p){if(!p)return;ensureBat(M,p).r++;M.runs[team]++;rbi++;earned++}
if(roll<walk){kind='四球';bs.bb++;ps.bb++;let [a,b,c]=bases;if(a&&b&&c)scoreRunner(c);bases=[batter,a?a:b,a&&b?b:c];
}else if(roll<walk+hit){bs.ab++;bs.h++;M.hits[team]++;ps.h++;let power=clamp(.055+(batter.power-45)*.0018+(team===M.ourIndex&&G.policy.hit==='長打'?.035:0),.02,.17);let extra=Math.random();let n=extra<power?4:extra<power+.07?3:extra<power+.25?2:1;kind=['','単打','二塁打','三塁打','本塁打'][n];if(n===2)bs.d2++;if(n===3)bs.d3++;if(n===4)bs.hr++;let newBases=[null,null,null];for(let i=2;i>=0;i--){let runner=bases[i];if(!runner)continue;let dest=i+n+(n===1&&Math.random()<.34?1:0);if(dest>=3)scoreRunner(runner);else newBases[dest]=runner}if(n===4)scoreRunner(batter);else newBases[n-1]=batter;bases=newBases;
}else{bs.ab++;let k=Math.random()<.21;kind=k?'三振':'凡退';if(k){bs.so++;ps.so++}outsMade=1;ps.outs++;M.outsByTeam[defense]++;}
bs.rbi+=rbi;ps.r+=earned;ps.er+=earned;return{bases,outs:outs+outsMade,kind,batter,rbi}}
function simulateHalf(M,team,inning){let defense=1-team;let bases=[null,null,null],outs=0,plays=0;let old=M.runs[team];while(outs<3&&plays++<30){let x=atBat(M,team,defense,bases,outs);outs=x.outs;bases=x.bases;if(x.rbi||x.kind==='本塁打')M.logs.push(`${inning}回${team===0?'表':'裏'}　${x.batter.name}：${x.kind}${x.rbi?'・'+x.rbi+'打点':''}`);if(inning>=9&&team===1&&M.runs[1]>M.runs[0])break}if(plays>=30){ // ensure valid defensive outs in pathological inning
 let pitcher=ensurePitch(M,M.pitchers[defense]);pitcher.outs+=3-outs;M.outsByTeam[defense]+=3-outs;
}M.score[team][inning-1]=M.runs[team]-old;M.logs.push(`${inning}回${team===0?'表':'裏'}終了　${M.teams[0].name} ${M.runs[0]} - ${M.runs[1]} ${M.teams[1].name}`)}
function simulateMatch(M){let i=1;for(;i<=12;i++){simulateHalf(M,0,i);if(i>=9&&M.runs[1]>M.runs[0])break;simulateHalf(M,1,i);if(i>=9&&M.runs[0]!==M.runs[1])break}if(M.runs[0]===M.runs[1]){ // rare tie after 12: award a final tiebreak hit with a recorded scorer
let winner=Math.random()<.5?0:1, p=M.teams[winner].players[M.batIndex[winner]%9];let b=ensureBat(M,p);b.pa++;b.ab++;b.h++;b.hr++;b.r++;b.rbi++;M.hits[winner]++;M.runs[winner]++;let loser=1-winner,q=ensurePitch(M,M.pitchers[loser]);q.h++;q.r++;q.er++;M.score[winner][11]=(M.score[winner][11]||0)+1;M.logs.push('延長タイブレークで決着');}

M.finished=true;return M}
function commitMatch(M){let our=M.ourIndex,opp=1-our,win=M.runs[our]>M.runs[opp];for(let p of G.lineup.map(player).filter(Boolean)){let s=p.stats,b=M.batStats.get(p),q=M.pitchStats.get(p);s.g++;s.xp+=rng(4,8);if(b)for(let k of ['pa','ab','h','d2','d3','hr','rbi','r','bb','so','sac','sb'])s[k]+=b[k];if(q){s.pG++;s.outs+=q.outs;s.ph+=q.h;s.pbb+=q.bb;s.pso+=q.so;s.per+=q.er;s.pr+=q.r;s.xp+=rng(2,4)}}let ourP=M.pitchers[our];if(ourP.stats){ourP.stats[win?'w':'l']++;}if(win){G.wins++;G.prestige=clamp(G.prestige+(M.ev.title==='練習試合'?1:3),0,100)}else{G.losses++;G.prestige=clamp(G.prestige-1,0,100)}let record={year:G.year,month:G.month,day:G.day,title:M.ev.title,homeRuns:M.runs[our],awayRuns:M.runs[opp],win};G.history.push(record);G.lastResult=record;M.ev.done=true;G.seq++;if(win&&M.ev.title!=='練習試合'&&M.ev.title!=='夏の甲子園'&&M.ev.title!=='春の選抜'){G.trophies+=Math.random()<.15?1:0}save();lastMatch=M}
function play(){let M=createMatch();if(!M)return;simulateMatch(M);commitMatch(M);view='result';render()}
function game(){let ev=isToday();if(!ev)return `<section class="panel">本日の試合はありません。<button onclick="nav('home')">戻る</button></section>`;return `<section class="panel"><h2>⚾ 試合前ミーティング</h2><div class="field"><div class="crowd"></div><div class="diamond"><div class="base b1"></div><div class="base b2"></div><div class="base b3"></div><div class="base home"></div></div><div class="ball"></div></div><h3>${esc(ev.title)}</h3><p class="muted">${G.school}のスタメン9名と采配方針を確認してください。</p>${policyUI()}<h3>スタメン</h3><div class="grid3">${G.lineup.map((id,i)=>{let p=player(id);return `<div class="person tiny">${i+1}番　${p?.pos||'?'}<br><b>${esc(p?.name||'?')}</b></div>`}).join('')}</div><div class="separator"></div><button class="gold" style="width:100%;font-size:19px" onclick="play()">🏟️ 試合を開始 → 結果を見る</button><p class="muted tiny">9回まで自動で進行します。選手別成績・投球回・試合経験をまとめて保存します。</p><button onclick="nav('roster')">打順を変更する</button></section>`}
function result(){let M=lastMatch;if(!M)return `<section class="panel"><h2>直近の結果</h2><p>${G.lastResult?`${esc(G.lastResult.title)} ${G.lastResult.homeRuns}−${G.lastResult.awayRuns}`:'まだ結果がありません'}</p><button onclick="nav('home')">戻る</button></section>`;let our=M.ourIndex,win=M.runs[our]>M.runs[1-our];return `<section class="panel result"><h2>${win?'🏆 勝利！':'⚾ 試合終了'}</h2><p style="text-align:center">${esc(M.ev.title)} ／ ${M.ev.year}年${M.ev.month}月${M.ev.day}日</p><div class="pitch"><div class="field"><div class="crowd"></div><div class="diamond"><div class="base b1"></div><div class="base b2"></div><div class="base b3"></div><div class="base home"></div></div><div class="ball"></div></div></div><h3>試合結果</h3><div style="overflow-x:auto"><table class="score"><tr><th>チーム</th>${Array.from({length:9},(_,i)=>`<th>${i+1}</th>`).join('')}<th>計</th><th>H</th></tr>${M.teams.map((t,k)=>`<tr><td>${esc(t.name)}</td>${Array.from({length:9},(_,i)=>`<td>${M.score[k][i]===null?'—':M.score[k][i]}</td>`).join('')}<td class="total">${M.runs[k]}</td><td>${M.hits[k]}</td></tr>`).join('')}</table></div><h3>自校・打撃成績</h3><div style="overflow-x:auto"><table class="stat"><tr><th>選手</th><th>打数</th><th>安打</th><th>本塁打</th><th>打点</th><th>四球</th></tr>${M.teams[our].players.map(p=>{let b=M.batStats.get(p)||{};return `<tr><td>${esc(p.name)}</td><td>${b.ab||0}</td><td>${b.h||0}</td><td>${b.hr||0}</td><td>${b.rbi||0}</td><td>${b.bb||0}</td></tr>`}).join('')}</table></div><h3>投手成績</h3><div style="overflow-x:auto"><table class="stat"><tr><th>投手</th><th>投球回</th><th>被安打</th><th>奪三振</th><th>失点</th></tr>${[M.pitchers[our]].map(p=>{let q=M.pitchStats.get(p)||{outs:0,h:0,so:0,r:0};return `<tr><td>${esc(p.name)}</td><td>${Math.floor(q.outs/3)}回${q.outs%3}/3</td><td>${q.h}</td><td>${q.so}</td><td>${q.r}</td></tr>`}).join('')}</table></div><details><summary>📣 試合経過を表示</summary><div class="log">${M.logs.map(t=>`<p>${esc(t)}</p>`).join('')}</div></details><p class="muted tiny">試合経験と個人成績は保存済みです。試合結果と成績の整合性を検査する仕組みを段階的に強化します。</p><button class="gold" style="width:100%" onclick="nav('home')">🏠 監督室へ戻る</button></section>`}
function render(){if(!G){$('app').innerHTML=`<section class="panel" style="text-align:center"><h2>⚾ 高校野球監督になろう</h2><div class="field"><div class="crowd"></div><div class="diamond"><div class="base b1"></div><div class="base b2"></div><div class="base b3"></div><div class="base home"></div></div><div class="ball"></div></div><p>選手を育て、打順と采配を決め、甲子園を目指すオリジナルゲームです。</p><button class="gold" style="width:100%" onclick="fresh()">🎮 新しく始める</button></section>`;return}$('app').innerHTML=header()+({home,roster,training,records,game,result}[view]||home)()}
if(load())render();else render();
</script></body></html>
